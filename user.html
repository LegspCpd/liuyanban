<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Seven戚 · 用户主页</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root{
  --bg:#f5faf5; --bg-card:#fff; --bg-input:#eaf3ea; --border:#c8e0c8;
  --text:#1e3a2e; --text-muted:#5a7a6a; --text-light:#8aaa9a;
  --primary:#2e7d32; --primary-light:#4caf50; --primary-bg:#e8f5e9;
  --shadow:0 8px 32px rgba(46,125,50,.12); --radius:16px; --radius-sm:10px;
  --font:"Space Grotesk","PingFang SC","Segoe UI",system-ui,sans-serif;
  --danger:#e57373; --danger-bg:#ffebee;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden}
#mainApp{display:flex;flex-direction:column;height:100vh;height:100dvh}
.app-header{flex-shrink:0;padding:12px 20px 8px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;z-index:50;min-height:56px}
.brand{font-weight:800;font-size:1.15em;color:var(--text);cursor:pointer}
.brand span{color:var(--primary)}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{background:none;border:none;cursor:pointer;padding:6px;color:var(--text);display:flex;border-radius:8px}
.header-gear{background:none;border:none;cursor:pointer;padding:6px;color:var(--text);display:flex;border-radius:8px;margin-right:6px}
.header-gear svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.header-gear:hover{background:var(--primary-bg)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{background:var(--primary-bg)}
.user-area{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:99px}
.user-area:hover{background:var(--primary-bg)}
.user-area .avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;background-size:cover;background-position:center;flex-shrink:0}
.user-area .user-name{font-size:.85em;font-weight:600}
.user-area .chevron{font-size:.7em;color:var(--text-light)}
.page-content{flex:1;overflow-y:auto;padding:16px 16px 80px}
.footer-container{flex-shrink:0}

/* 资料卡 */
.profile-hero{background:linear-gradient(135deg,#2e7d32,#4caf50);border-radius:var(--radius);padding:24px 20px 20px;color:#fff;position:relative;overflow:hidden}
.profile-hero::after{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;background:rgba(255,255,255,.1);border-radius:50%}
.hero-top{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.hero-avatar{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.25);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;background-size:cover;background-position:center;flex-shrink:0;border:3px solid rgba(255,255,255,.5)}
.hero-info{flex:1;min-width:0}
.hero-name{font-size:1.3em;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero-no{font-size:.7em;opacity:.8;margin-top:2px}
.hero-bio{font-size:.82em;opacity:.92;margin-top:8px;line-height:1.5;position:relative;z-index:1}
.hero-meta{display:flex;gap:14px;margin-top:12px;position:relative;z-index:1;font-size:.78em}
.hero-meta span{display:flex;align-items:center;gap:4px}
.hero-actions{display:flex;gap:10px;margin-top:16px;position:relative;z-index:1}
.btn-follow{flex:1;padding:11px;border:2px solid #fff;border-radius:10px;font-weight:800;font-family:inherit;font-size:.9em;cursor:pointer;background:#fff;color:var(--primary)}
.btn-follow.following{background:transparent;color:#fff}
.btn-edit-profile{flex:1;padding:11px;border:2px solid #fff;border-radius:10px;font-weight:800;font-family:inherit;font-size:.9em;cursor:pointer;background:#fff;color:var(--primary)}
.hero-stats{display:flex;gap:20px;margin-top:14px;position:relative;z-index:1}
.hero-stat{text-align:center}
.hero-stat .num{font-size:1.1em;font-weight:800}
.hero-stat .lbl{font-size:.68em;opacity:.85}

/* Tab */
.tabs{display:flex;gap:8px;margin:16px 0 12px;border-bottom:1px solid var(--border)}
.tab{padding:10px 4px;border:none;background:none;font-family:inherit;font-size:.88em;font-weight:700;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-right:8px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

/* 帖子卡 */
.post-card{background:var(--bg-card);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(46,125,50,.05);cursor:pointer}
.post-card .post-title{font-weight:700;font-size:.95em;margin-bottom:6px}
.post-card .post-body{font-size:.82em;color:var(--text-muted);line-height:1.5;max-height:60px;overflow:hidden}
.post-card .post-foot{font-size:.7em;color:var(--text-light);margin-top:8px;display:flex;gap:12px}
.empty{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:.85em}

/* 编辑弹窗 */
.edit-modal{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
.edit-modal.active{display:flex}
.edit-box{background:#fff;border-radius:var(--radius);padding:22px 20px;max-width:400px;width:100%;max-height:86vh;overflow-y:auto}
.edit-box h3{font-size:1.05em;margin-bottom:16px}
.edit-field{margin-bottom:14px}
.edit-field label{display:block;font-size:.78em;font-weight:700;color:var(--text-muted);margin-bottom:6px}
.edit-field input,.edit-field select,.edit-field textarea{width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:10px;font-family:inherit;font-size:.88em;outline:none;background:var(--bg-input);color:var(--text);box-sizing:border-box}
.edit-field textarea{min-height:70px;resize:vertical}
.edit-field input:focus,.edit-field textarea:focus,.edit-field select:focus{border-color:var(--primary)}
.edit-actions{display:flex;gap:10px;margin-top:8px}
.edit-actions button{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;font-family:inherit;font-size:.88em;cursor:pointer}
.edit-actions .cancel{background:var(--bg-input);color:var(--text-muted)}
.edit-actions .ok{background:var(--primary);color:#fff}

/* 头像上传 */
.avatar-edit{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.avatar-edit .av{width:64px;height:64px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;background-size:cover;background-position:center;flex-shrink:0}
.avatar-edit label{font-size:.8em;color:var(--primary);font-weight:700;cursor:pointer;text-decoration:underline}

/* 底部导航 */
.app-tabs{flex-shrink:0;display:flex;background:rgba(255,255,255,.96);border-top:1px solid var(--border);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:50}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;font-family:var(--font);font-size:.6em;font-weight:600;color:var(--text-muted);padding:4px 0;cursor:pointer;text-decoration:none;position:relative}
.tab-btn .tab-icon{font-size:1.6em;line-height:1.2;display:flex;align-items:center;justify-content:center;width:1.7em;height:1.7em}
.tab-btn .tab-icon svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none}
.tab-btn.active{color:var(--primary)}
.tab-btn.active::after{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;background:var(--primary);border-radius:0 0 4px 4px}
.tab-btn .badge{position:absolute;top:-2px;right:15%;background:#e57373;color:#fff;font-size:.6em;font-weight:700;padding:1px 6px;border-radius:99px;min-width:16px;text-align:center}
/* 顶部 header 结构（renderHeader 生成） */
.app-header .brand{font-weight:800;font-size:1.15em;color:var(--text);cursor:pointer}
.app-header .brand span{color:var(--primary)}
.app-header .brand small{font-size:.6em;color:var(--text-muted);font-weight:600}
.app-header .user-area{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:99px}
.app-header .user-area .avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;background-size:cover;background-position:center}
.app-header .user-area .user-name{font-size:.85em;font-weight:600}
.app-header .user-area .chevron{font-size:.7em;color:var(--text-light)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.82);color:#fff;padding:10px 20px;border-radius:10px;font-size:.85em;opacity:0;pointer-events:none;transition:all .3s;z-index:9999;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="mainApp">
  <div class="app-header" id="header-container"></div>
  <div class="page-content" id="pageContent">
    <div class="empty">加载中…</div>
  </div>
  <div class="footer-container" id="footer-container"></div>
</div>

<!-- 编辑资料弹窗 -->
<div class="edit-modal" id="editModal">
  <div class="edit-box">
    <h3>编辑资料</h3>
    <div class="avatar-edit">
      <div class="av" id="editAvatar">U</div>
      <div>
        <label for="editAvatarInput">更换头像</label>
        <input type="file" id="editAvatarInput" accept="image/*" style="display:none" />
      </div>
    </div>
    <div class="edit-field"><label>昵称</label><input type="text" id="editNickname" maxlength="12" /></div>
    <div class="edit-field"><label>简介</label><textarea id="editBio" maxlength="100" placeholder="介绍一下自己…"></textarea></div>
    <div class="edit-field"><label>性别</label><select id="editGender"><option value="">保密</option><option value="男">男</option><option value="女">女</option></select></div>
    <div class="edit-field"><label>生日</label><input type="date" id="editBirthday" /></div>
    <div class="edit-actions">
      <button class="cancel" onclick="closeEdit()">取消</button>
      <button class="ok" onclick="saveProfile()">保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/liuyanban/common.js"></script>
<script>

// ============================================================
// 用户主页
// ============================================================
var currentUser = getSessionUser();
if (!currentUser || !currentUser.id) window.location.href = '/liuyanban/index.html';

var viewingUser = null;   // 被查看的用户
var isSelf = false;
var iFollowed = false;
var myPosts = [];

function $(id){ return document.getElementById(id); }
function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function showToast(msg){ var t=$('toast'); if(!t) return; t.textContent=msg; t.classList.add('show'); clearTimeout(window.__tt); window.__tt=setTimeout(function(){t.classList.remove('show');},2200); }

// 从 URL 取目标用户（?u=user_no 或 ?id=uuid）
function getTargetParam(){
  var p = new URLSearchParams(location.search);
  return { no: p.get('u'), id: p.get('id') };
}

async function loadUser(){
  var t = getTargetParam();
  var q = window.sb.from('users').select('*');
  if (t.no) q = q.eq('user_no', t.no);
  else if (t.id) q = q.eq('id', t.id);
  else q = q.eq('id', currentUser.id);   // 默认看自己
  var res = await q.single();
  if (res.error || !res.data) { $('pageContent').innerHTML = '<div class="empty">用户不存在</div>'; return false; }
  viewingUser = res.data;
  isSelf = (viewingUser.id === currentUser.id);
  return true;
}

function calcAge(birthday){
  if(!birthday) return null;
  var b = new Date(birthday); var now = new Date();
  var age = now.getFullYear() - b.getFullYear();
  var m = now.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < b.getDate())) age--;
  return (age >= 0 && age < 150) ? age : null;
}

function avatarOf(u){
  if (u.avatar_url && String(u.avatar_url).indexOf('http') === 0)
    return '<div class="hero-avatar" style="background-image:url(' + escapeHtml(u.avatar_url) + ');background-size:cover;background-position:center;"></div>';
  return '<div class="hero-avatar">' + escapeHtml(String(u.nickname||'U').charAt(0).toUpperCase()) + '</div>';
}

async function loadFollow(){
  if (isSelf) return;
  var r = await window.sb.from('follows').select('id').eq('follower_id', currentUser.id).eq('following_id', viewingUser.id);
  iFollowed = !!(r.data && r.data.length);
}

async function loadCounts(){
  var f1 = await window.sb.from('follows').select('id', { count:'exact', head:true }).eq('following_id', viewingUser.id); // 粉丝
  var f2 = await window.sb.from('follows').select('id', { count:'exact', head:true }).eq('follower_id', viewingUser.id);   // 关注
  return { fans: f1.count || 0, following: f2.count || 0 };
}

async function loadPosts(){
  var r = await window.sb.from('posts').select('*').eq('user_id', viewingUser.id).order('created_at', { ascending:false });
  myPosts = r.data || [];
}

async function render(){
  if (!(await loadUser())) return;
  await loadFollow();
  await loadPosts();
  var counts = await loadCounts();
  var age = calcAge(viewingUser.birthday);

  var hero = '<div class="profile-hero">';
  hero += '<div class="hero-top">' + avatarOf(viewingUser);
  hero += '<div class="hero-info"><div class="hero-name">' + escapeHtml(viewingUser.nickname || '用户') + '</div>';
  hero += '<div class="hero-no">ID: ' + escapeHtml(viewingUser.user_no || viewingUser.id.slice(0,8)) + '</div></div></div>';
  if (viewingUser.bio) hero += '<div class="hero-bio">' + escapeHtml(viewingUser.bio) + '</div>';
  // 性别/生日/年龄
  var meta = [];
  if (viewingUser.gender) meta.push('<span>👤 ' + escapeHtml(viewingUser.gender) + '</span>');
  if (age !== null) meta.push('<span>🎂 ' + age + ' 岁</span>');
  if (meta.length) hero += '<div class="hero-meta">' + meta.join('') + '</div>';
  // 统计
  hero += '<div class="hero-stats"><div class="hero-stat"><div class="num">' + myPosts.length + '</div><div class="lbl">帖子</div></div>';
  hero += '<div class="hero-stat"><div class="num">' + counts.fans + '</div><div class="lbl">粉丝</div></div>';
  hero += '<div class="hero-stat"><div class="num">' + counts.following + '</div><div class="lbl">关注</div></div></div>';
  // 操作按钮
  hero += '<div class="hero-actions">';
  if (isSelf) {
    hero += '<button class="btn-edit-profile" onclick="openEdit()">编辑资料</button>';
  } else {
    hero += '<button class="btn-follow' + (iFollowed?' following':'') + '" onclick="toggleFollow()">' + (iFollowed?'已关注':'+ 关注') + '</button>';
  }
  hero += '</div></div>';

  // 帖子列表
  var postsHtml = '<div class="tabs"><button class="tab active">他的帖子 (' + myPosts.length + ')</button></div>';
  if (myPosts.length) {
    postsHtml += myPosts.map(function(p){
      return '<div class="post-card" onclick="goPost(\'' + p.id + '\')">' +
        (p.title ? '<div class="post-title">' + escapeHtml(p.title) + '</div>' : '') +
        '<div class="post-body">' + escapeHtml((p.content||'').substring(0,120)) + '</div>' +
        '<div class="post-foot"><span>' + new Date(p.created_at).toLocaleDateString('zh-CN') + '</span></div></div>';
    }).join('');
  } else {
    postsHtml += '<div class="empty">还没有发过帖子</div>';
  }

  $('pageContent').innerHTML = hero + postsHtml;
}

function goPost(id){ location.href = '/liuyanban/posts.html#post-' + id; }
window.goPost = goPost;
async function toggleFollow(){
  if (isSelf) return;
  try{
    if (iFollowed) {
      await window.sb.from('follows').delete().eq('follower_id', currentUser.id).eq('following_id', viewingUser.id);
      iFollowed = false;
      showToast('已取消关注');
    } else {
      await window.sb.from('follows').insert([{ follower_id: currentUser.id, following_id: viewingUser.id }]);
      iFollowed = true;
      showToast('已关注');
    }
    await render();
  }catch(e){ showToast('操作失败：' + e.message); }
}

// ====== 编辑资料 ======
function openEdit(){
  var u = viewingUser;
  $('editNickname').value = u.nickname || '';
  $('editBio').value = u.bio || '';
  $('editGender').value = u.gender || '';
  $('editBirthday').value = u.birthday || '';
  var av = $('editAvatar');
  if (u.avatar_url && String(u.avatar_url).indexOf('http') === 0) {
    av.style.backgroundImage = 'url(' + u.avatar_url + ')'; av.textContent = '';
  } else {
    av.style.backgroundImage = ''; av.textContent = String(u.nickname||'U').charAt(0).toUpperCase();
  }
  $('editModal').classList.add('active');
}
function closeEdit(){ $('editModal').classList.remove('active'); }
window.openEdit = openEdit; window.closeEdit = closeEdit; window.toggleFollow = toggleFollow;

async function saveProfile(){
  var patch = {
    nickname: $('editNickname').value.trim(),
    bio: $('editBio').value.trim(),
    gender: $('editGender').value,
    birthday: $('editBirthday').value || null
  };
  if (!patch.nickname) return showToast('昵称不能为空');
  try{
    await window.sb.from('users').update(patch).eq('id', currentUser.id);
    // 更新本地 session
    var u = getSessionUser() || {};
    u.nickname = patch.nickname; u.bio = patch.bio; u.gender = patch.gender; u.birthday = patch.birthday;
    setSessionUser(u);
    currentUser = u;
    showToast('已保存');
    closeEdit();
    await render();
  }catch(e){ showToast('保存失败：' + e.message); }
}
window.saveProfile = saveProfile;

// 头像上传
document.getElementById('editAvatarInput').onchange = async function(e){
  var file = e.target.files[0]; if (!file) return;
  if (file.size > 5*1024*1024) { showToast('图片不能超过 5MB'); this.value=''; return; }
  try{
    showToast('上传中...');
    var ext = (file.name.split('.').pop() || 'png').toLowerCase();
    var path = 'avatars/' + currentUser.id + '/profile_' + Date.now() + '.' + ext;
    var up = await window.sb.storage.from('avatars').upload(path, file, { contentType: file.type, upsert: false });
    if (up.error) throw up.error;
    var url = window.sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
    await window.sb.from('users').update({ avatar_url: url }).eq('id', currentUser.id);
    var u = getSessionUser() || {}; u.avatar_url = url; setSessionUser(u); currentUser = u;
    viewingUser.avatar_url = url;
    var av = $('editAvatar'); av.style.backgroundImage = 'url(' + url + ')'; av.textContent = '';
    showToast('头像已更新');
  }catch(err){ showToast('上传失败：' + err.message); }
};

// ====== 初始化 ======
(async function init(){
  if (typeof renderFooter === "function") renderFooter("profile");
  await render();   // 先渲染，确定 isSelf
  if (typeof renderHeader === "function") renderHeader("用户主页", "profile");
  // 右上角"设置"图标（仅看自己时；进设置中心 profile.html）
  try{
    if (isSelf) {
      var hc = document.getElementById("header-container");
      var appHeader = hc ? hc.querySelector(".app-header") : null;
      if (appHeader) {
        var gear = document.createElement("button");
        gear.className = "header-gear";
        gear.title = "设置";
        gear.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
        gear.onclick = function(){ location.href = "/liuyanban/profile.html"; };
        appHeader.insertBefore(gear, appHeader.lastElementChild);
      }
    }
  }catch(e){}
})();

</script>
</body>
</html>
