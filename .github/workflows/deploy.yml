name: 构建并部署

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'db/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # 默认目标平台；改为 neon 则对 Neon 建表。两个平台可分别配置、共存
  DB_PROVIDER: ${{ vars.DB_PROVIDER }}

jobs:
  build:
    name: 构建站点
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 执行构建
        env:
          # 未配置时沿用源码默认值，构建照样成功
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: node scripts/build.mjs
      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # 首次部署时 Pages 站点尚未创建，enablement=true 让本步骤自动启用并创建站点，
          # 否则 configure-pages 会因 "站点不存在" 直接失败
          enablement: true
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  database:
    name: 自动建表
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 应用数据库 Schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: node scripts/apply-schema.mjs
      - name: 汇总
        if: always()
        run: echo "::notice::建表任务结束。若显示跳过，请检查是否已按 README 配置对应平台的凭据。"

  deploy:
    name: 部署到 Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
