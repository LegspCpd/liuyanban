name: 数据库维护

on:
  workflow_dispatch:
    inputs:
      provider:
        description: '目标平台：supabase / neon / postgres'
        type: choice
        required: false
        default: supabase
        options:
          - supabase
          - neon
          - postgres
      dry_run:
        description: '仅检查通道并打印 SQL，不实际执行'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  migrate:
    name: 应用 Schema
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      - name: 安装 Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: 执行
        env:
          DB_PROVIDER: ${{ inputs.provider }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: node scripts/apply-schema.mjs --provider=${{ inputs.provider }} ${{ inputs.dry_run && '--dry-run' || '' }}
