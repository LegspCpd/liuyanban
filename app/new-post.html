<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Seven戚 · 发帖</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        :root {
            --bg: #f5faf5;
            --bg-card: #ffffff;
            --bg-input: #eaf3ea;
            --border: #c8e0c8;
            --text: #1e3a2e;
            --text-muted: #5a7a6a;
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --primary-bg: #e8f5e9;
            --shadow: 0 8px 32px rgba(46,125,50,0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --font: "Space Grotesk", "PingFang SC", "Segoe UI", system-ui, sans-serif;
            --danger: #e57373;
            --official-blue: #2b6cff;
        }
        html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; }
        #mainApp { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: var(--bg); }

        .app-header {
            flex-shrink: 0; padding: 12px 20px;
            background: rgba(255,255,255,0.92);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            min-height: 56px; z-index: 50;
        }
        .app-header .back-btn {
            background: none; border: none; cursor: pointer; color: var(--text);
            display: flex; align-items: center; padding: 4px;
            text-decoration: none;
        }
        .app-header .back-btn svg {
            width: 24px; height: 24px; fill: none; stroke: currentColor;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        .app-header .title { font-weight: 700; font-size: 1em; }
        .app-header .placeholder { width: 32px; }

        .app-content {
            flex: 1; overflow-y: auto; padding: 16px 20px;
            -webkit-overflow-scrolling: touch;
        }

        .field-group { margin-bottom: 16px; }
        .field-group label {
            display: block; font-size: 0.7em; font-weight: 600;
            color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 0.05em; margin-bottom: 4px;
        }
        .field-group input, .field-group select {
            width: 100%; padding: 10px 12px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            background: var(--bg-input);
            font-family: inherit; font-size: 0.9em;
            outline: none; color: var(--text);
        }
        .field-group input:focus, .field-group select:focus { border-color: var(--primary); }

        .editor-container { position: relative; }
        .editor-toolbar {
            display: flex; flex-wrap: wrap; gap: 4px;
            margin-bottom: 8px; padding: 6px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }
        .editor-toolbar button {
            background: none; border: none; cursor: pointer;
            padding: 6px 8px; border-radius: 6px;
            color: var(--text-muted);
            transition: background 0.2s;
            display: flex; align-items: center;
            pointer-events: auto;
            z-index: 10;
        }
        .editor-toolbar button:hover, .editor-toolbar button.active {
            background: var(--primary-bg); color: var(--primary);
        }
        .editor-toolbar button svg {
            width: 18px; height: 18px; fill: none; stroke: currentColor;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }

        .editor-content {
            min-height: 200px; max-height: 400px;
            overflow-y: auto; border: 2px solid var(--border);
            border-radius: var(--radius-sm); padding: 12px;
            background: var(--bg-input); font-size: 0.9em;
            line-height: 1.6; outline: none; word-break: break-word;
        }
        .editor-content img { max-width: 100%; border-radius: 8px; margin: 4px 0; }
        .editor-content a { color: var(--official-blue); text-decoration: underline; cursor: pointer; }
        .editor-content .chapter-block {
            display: block; margin: 8px 0; padding: 8px 12px;
            border-left: 4px solid; background: rgba(0,0,0,0.03);
            border-radius: 4px;
        }

        .editor-container.fullscreen-mode {
            position: fixed; inset: 0; z-index: 9999;
            background: #fff; display: flex; flex-direction: column;
        }
        .editor-container.fullscreen-mode .editor-toolbar {
            flex-shrink: 0; margin: 12px;
        }
        .editor-container.fullscreen-mode .editor-content {
            flex: 1; max-height: none; margin: 0 12px 12px 12px;
        }
        .editor-container.fullscreen-mode .fullscreen-exit {
            display: flex !important;
        }
        .fullscreen-exit {
            display: none; position: absolute; top: 20px; right: 20px;
            z-index: 10000; background: var(--primary); color: #fff;
            border: none; border-radius: 99px; padding: 8px 16px;
            cursor: pointer; font-weight: 600; font-size: 0.85em;
            align-items: center; gap: 4px;
        }
        .fullscreen-exit svg {
            width: 16px; height: 16px; fill: none; stroke: currentColor;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }

        .poll-builder {
            margin-top: 12px; padding: 12px;
            border: 1px dashed var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-card);
        }
        .poll-builder label { font-weight: 600; font-size: 0.85em; }
        .poll-builder input[type="text"] {
            width: 100%; margin: 6px 0; padding: 8px;
            border: 2px solid var(--border); border-radius: 6px;
            font-size: 0.85em; outline: none;
        }
        .poll-option-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
        .poll-option-row input {
            flex: 1; padding: 8px 10px;
            border: 2px solid var(--border); border-radius: 6px;
            font-size: 0.85em; outline: none;
        }
        .poll-option-row button {
            background: none; border: none; cursor: pointer;
            color: var(--danger); font-size: 1.2em; padding: 0 4px;
        }
        .poll-builder .add-option-btn {
            margin-top: 4px; background: var(--primary-bg);
            color: var(--primary); border: none; border-radius: 6px;
            padding: 6px 12px; cursor: pointer; font-size: 0.8em;
        }

        .actions { display: flex; gap: 8px; margin-top: 16px; }
        .actions button {
            flex: 1; padding: 12px; border-radius: var(--radius-sm);
            border: none; font-weight: 700; font-size: 1em;
            cursor: pointer; font-family: inherit;
            transition: background 0.2s;
        }
        .actions .btn-primary { background: var(--primary); color: #fff; }
        .actions .btn-primary:hover { background: var(--primary-light); }
        .actions .btn-primary:disabled { opacity: 0.5; pointer-events: none; }
        .actions .btn-secondary { background: var(--bg-input); color: var(--text-muted); }

        #toast {
            position: fixed; bottom: 80px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--text); color: #fff;
            padding: 0.7em 1.6em; border-radius: 2em;
            font-weight: 600; font-size: 0.85em;
            opacity: 0; transition: all 0.4s ease;
            z-index: 99999; pointer-events: none;
            white-space: nowrap; box-shadow: var(--shadow);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* 自定义链接弹窗 */
        .link-modal-overlay {
            position: fixed; inset: 0; z-index: 20000;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            padding: 20px;
        }
        .link-modal-overlay.active { display: flex; }
        .link-modal-box {
            background: #fff; border-radius: 16px;
            max-width: 400px; width: 100%; padding: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .link-modal-box h3 { font-size: 1.1em; font-weight: 700; margin-bottom: 16px; }
        .link-modal-box .form-group { margin-bottom: 12px; }
        .link-modal-box .form-group label {
            display: block; font-size: 0.75em; font-weight: 600;
            color: #5a7a6a; margin-bottom: 4px;
        }
        .link-modal-box .form-group input {
            width: 100%; padding: 8px 12px;
            border: 2px solid #c8e0c8; border-radius: 8px;
            font-size: 0.9em; outline: none;
        }
        .link-modal-box .form-group input:focus { border-color: #2e7d32; }
        .link-modal-box .modal-actions {
            display: flex; gap: 8px; justify-content: flex-end;
            margin-top: 16px;
        }
        .link-modal-box .modal-actions button {
            padding: 8px 18px; border-radius: 8px; border: none;
            font-weight: 600; font-size: 0.85em; cursor: pointer;
        }
        .link-modal-box .modal-actions .btn-cancel {
            background: #eaf3ea; color: #5a7a6a;
        }
        .link-modal-box .modal-actions .btn-confirm {
            background: #2e7d32; color: #fff;
        }

        @media (max-width: 480px) {
            .app-header { padding: 10px 14px; }
            .app-content { padding: 12px 14px; }
        }
    </style>
</head>
<body>
    <div id="mainApp">
        <div class="app-header">
            <!-- 左上角返回按钮：直接跳转到帖子列表 -->
            <a href="posts.html" class="back-btn" title="返回帖子广场">
                <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </a>
            <span class="title"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>发帖</span>
            <div class="placeholder"></div>
        </div>

        <div class="app-content">
            <div class="field-group">
                <label>标题（选填）</label>
                <input type="text" id="postTitleInput" maxlength="100" placeholder="输入帖子标题..." />
            </div>

            <div class="field-group">
                <label>分类</label>
                <select id="postCategorySelect"></select>
            </div>

            <div class="field-group">
                <label>正文（支持富文本）</label>
                <div class="editor-container" id="editorContainer">
                    <div class="editor-toolbar" id="editorToolbar">
                        <button type="button" onclick="execCommand('bold')" title="粗体">
                            <svg viewBox="0 0 24 24"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6zM6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg>
                        </button>
                        <button type="button" onclick="execCommand('italic')" title="斜体">
                            <svg viewBox="0 0 24 24"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
                        </button>
                        <button type="button" onclick="execCommand('underline')" title="下划线">
                            <svg viewBox="0 0 24 24"><path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"/><line x1="4" y1="21" x2="20" y2="21"/></svg>
                        </button>
                        <button type="button" onclick="execCommand('justifyLeft')" title="左对齐">
                            <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg>
                        </button>
                        <button type="button" onclick="execCommand('justifyCenter')" title="居中">
                            <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
                        </button>
                        <button type="button" onclick="execCommand('justifyRight')" title="右对齐">
                            <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="6" y1="18" x2="21" y2="18"/></svg>
                        </button>
                        <button type="button" onclick="addChapter()" title="章节模式">
                            <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="15" x2="12" y2="15"/></svg>
                        </button>
                        <button type="button" onclick="insertImage()" title="插入图片">
                            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        </button>
                        <button type="button" onclick="showLinkModal()" title="插入链接" id="linkBtn">
                            <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                        </button>
                        <button type="button" onclick="addPoll()" title="添加投票">
                            <svg viewBox="0 0 24 24"><path d="M9 11V6a2 2 0 0 1 4 0v5"/><path d="M13 11V6a2 2 0 0 1 4 0v5"/><path d="M17 11V5a2 2 0 0 1 4 0v7a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6V9"/></svg>
                        </button>
                        <button type="button" onclick="toggleFullscreen()" title="全屏编辑">
                            <svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                        </button>
                    </div>
                    <div class="editor-content" id="richEditor" contenteditable="true"></div>
                    <button class="fullscreen-exit" id="fullscreenExitBtn" onclick="toggleFullscreen()">
                        <svg viewBox="0 0 24 24"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                        退出全屏
                    </button>
                </div>
                <div id="pollBuilderContainer"></div>
            </div>

            <div class="actions">
                <button class="btn-secondary" onclick="window.location.href='/liuyanban/posts.html'">取消</button>
                <button class="btn-primary" id="submitPostBtn">发布</button>
            </div>
        </div>
    </div>

    <!-- 自定义链接弹窗 -->
    <div class="link-modal-overlay" id="linkModalOverlay">
        <div class="link-modal-box">
            <h3><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>插入链接</h3>
            <div class="form-group">
                <label>链接地址（必填，以 https:// 开头）</label>
                <input type="text" id="linkUrlInput" placeholder="https://example.com" />
            </div>
            <div class="form-group">
                <label>链接文字（选填，留空显示网址）</label>
                <input type="text" id="linkTextInput" placeholder="输入链接显示文字..." />
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeLinkModal()">取消</button>
                <button class="btn-confirm" onclick="confirmInsertLink()">确定</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script src="/liuyanban/core/config.js"></script>
<script src="/liuyanban/core/util.js"></script>
<script src="/liuyanban/core/ui.js"></script>
<script src="/liuyanban/core/session.js"></script>
<script src="/liuyanban/core/data.js"></script>
<script src="/liuyanban/core/mods.js"></script>
<script src="/liuyanban/core/shell.js"></script>
<script src="/liuyanban/core/boot.js"></script>
<script src="/liuyanban/new-post/new-post.js"></script>
</body>
</html>
