<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Seven戚 · 聊天群</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5faf5;--bg-card:#fff;--bg-input:#eaf3ea;--border:#c8e0c8;--text:#1e3a2e;--text-muted:#5a7a6a;--text-light:#8aaa9a;--primary:#2e7d32;--primary-light:#4caf50;--primary-bg:#e8f5e9;--shadow:0 8px 32px rgba(46,125,50,.12);--radius:16px;--radius-sm:10px;--font:"Space Grotesk","PingFang SC","Segoe UI",system-ui,sans-serif;--danger:#e57373;--success:#22c55e;--official-blue:#2b6cff;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden}
#mainApp{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--bg)}
.app-header{flex-shrink:0;padding:12px 16px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;min-height:56px;z-index:50;gap:8px}
.app-header .brand{font-weight:900;font-size:1.05em;display:flex;align-items:center;gap:.35em;cursor:pointer;white-space:nowrap}
.app-header .brand span{color:var(--primary)}
.app-header .brand small{font-weight:400;font-size:.55em;color:var(--text-muted);margin-left:.3em}
.header-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
.user-area{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px 4px 4px;border-radius:99px}
.user-area:hover{background:var(--primary-bg)}
.user-area .avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0;background-size:cover;background-position:center}
.user-area .user-name{font-weight:600;font-size:.8em;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots-btn{background:none;border:none;cursor:pointer;padding:6px;border-radius:50%;display:grid;place-items:center;color:var(--text-muted);flex-shrink:0;position:relative}
.dots-btn:hover{background:var(--primary-bg);color:var(--primary)}
.dots-btn svg{width:22px;height:22px;fill:currentColor}
.dots-btn .online-badge{position:absolute;top:0;right:0;background:var(--success);color:#fff;font-size:.55em;font-weight:800;padding:1px 5px;border-radius:99px;line-height:13px;min-width:14px;text-align:center}
.app-tabs{flex-shrink:0;display:flex;background:rgba(255,255,255,.96);border-top:1px solid var(--border);padding:6px 0 calc(6px + var(--safe-b));z-index:50}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;font-family:var(--font);font-size:.6em;font-weight:600;color:var(--text-muted);padding:4px 0;cursor:pointer;text-decoration:none;position:relative}
.tab-btn .tab-icon{font-size:1.6em;line-height:1.2;display:flex;align-items:center;justify-content:center;width:1.7em;height:1.7em}
.tab-btn .tab-icon svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none}
.tab-btn.active{color:var(--primary)}
.tab-btn.active::after{content:'';position:absolute;top:-1px;left:30%;right:30%;height:3px;background:var(--primary);border-radius:0 0 4px 4px}
.tab-btn .badge{position:absolute;top:-2px;right:15%;background:#e57373;color:#fff;font-size:.6em;font-weight:700;padding:1px 6px;border-radius:99px;min-width:16px;text-align:center}
.banned-banner{flex-shrink:0;background:#ffebee;color:#c62828;padding:6px 16px;font-size:.8em;font-weight:600;text-align:center;border-bottom:1px solid #ffcdd2;display:none}
.banned-banner.active{display:block}
.app-content{flex:1;min-height:0;display:flex;flex-direction:column}
.chat-messages{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:4px;-webkit-overflow-scrolling:touch}
.time-divider{text-align:center;font-size:.7em;color:var(--text-light);padding:6px 0;position:relative}
.time-divider span{background:var(--bg);padding:0 12px;position:relative;z-index:1}
.time-divider::before{content:'';position:absolute;left:10%;right:10%;top:50%;height:1px;background:var(--border);z-index:0}
.chat-msg{max-width:85%;padding:8px 12px;border-radius:var(--radius-sm);background:var(--bg-card);border:1px solid var(--border);align-self:flex-start;flex-shrink:0;position:relative}
.chat-msg.self{align-self:flex-end;background:var(--primary-bg);border-color:var(--primary)}
.chat-msg.deleted{opacity:.6;background:#f0f0f0;border-color:#ccc}
.chat-msg.deleted .chat-text{color:var(--text-muted);font-style:italic}
.chat-msg.deleted .deleted-by{color:var(--official-blue);font-weight:600}
.chat-msg .msg-header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.chat-msg .msg-header .avatar{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px;flex-shrink:0;background-size:cover;background-position:center}
.chat-msg .msg-header .name{font-weight:600;font-size:.82em}
.chat-msg .msg-header .official-badge{font-size:.5em;background:var(--primary);color:#fff;padding:0 6px;border-radius:99px;line-height:16px}
.chat-msg .chat-text{font-size:.85em;line-height:1.5;word-break:break-word}
.pill-bar{flex-shrink:0;display:flex;gap:8px;align-items:center;padding:8px 16px 0;overflow-x:auto;background:var(--bg)}
.pill-btn{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 22px;border-radius:999px;border:2px solid var(--border);background:var(--bg-card);color:var(--text);font-family:inherit;font-weight:700;font-size:.8em;cursor:pointer;white-space:nowrap;transition:.2s}
.pill-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}
.pill-btn:active{transform:scale(.97)}
.pill-btn svg{width:15px;height:15px;flex-shrink:0}
.pill-new{position:absolute;top:-7px;right:-4px;background:var(--success);color:#fff;font-size:.6em;font-weight:800;padding:1px 6px;border-radius:999px;line-height:14px;box-shadow:0 2px 6px rgba(34,197,94,.5);letter-spacing:.5px}
.fixed-input-area{flex-shrink:0;padding:10px 16px calc(10px + var(--safe-b));background:var(--bg);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fixed-input-area .input-wrapper{flex:1;display:flex;gap:8px;min-width:0}
.fixed-input-area input{flex:1;padding:10px 14px;border-radius:99px;border:2px solid var(--border);background:var(--bg-input);font-family:inherit;font-size:.85em;outline:none;min-width:0;color:var(--text)}
.fixed-input-area input:focus{border-color:var(--primary)}
.fixed-input-area input:disabled{opacity:.5}
.fixed-input-area button{padding:8px 18px;border-radius:99px;border:none;background:var(--primary);color:#fff;font-weight:700;font-size:.85em;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;font-family:inherit}
.fixed-input-area button:hover{background:var(--primary-light)}
.fixed-input-area button:disabled{opacity:.5;pointer-events:none}
.fixed-input-area .admin-clear-btn{background:var(--danger);color:#fff;padding:6px 12px;border-radius:99px;border:none;font-size:.7em;cursor:pointer;display:none}
.icon-svg{width:1.2em;height:1.2em;fill:currentColor;flex-shrink:0}
.empty-state{text-align:center;color:var(--text-muted);padding:40px 20px;font-size:.85em}
.empty-state .big{font-size:2.8em;margin-bottom:8px;opacity:.5}
.loading-state{text-align:center;color:var(--text-muted);padding:40px 20px;font-size:.9em}
.loading-state .spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.chat-ctx-menu{position:fixed;z-index:10000;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.15);padding:4px 0;min-width:130px}
.chat-ctx-item{padding:10px 16px;font-size:.85em;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:8px}
.chat-ctx-item:hover{background:var(--primary-bg);color:var(--primary)}
.chat-ctx-item.danger:hover{background:#ffebee;color:var(--danger)}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:.7em 1.5em;border-radius:2em;font-weight:600;font-size:.85em;opacity:0;transition:all .4s ease;z-index:9999;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow);max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.custom-modal{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.custom-modal.active{display:flex}
.custom-modal .modal-box{background:var(--bg-card);border-radius:var(--radius);max-width:420px;width:100%;padding:24px;box-shadow:var(--shadow);border:1px solid var(--border)}
.modal-title{font-size:1.2em;font-weight:700;margin-bottom:8px}
.modal-body{font-size:.95em;color:var(--text-muted);margin-bottom:16px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.modal-actions button{padding:6px 18px;border-radius:var(--radius-sm);border:none;font-weight:600;cursor:pointer;font-family:inherit}
.modal-actions .btn-danger{background:var(--danger);color:#fff}
.modal-actions .btn-secondary{background:var(--bg-input);color:var(--text-muted)}
/* 在线用户 overlay */
.online-overlay{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);will-change:transform}
.online-overlay.open{transform:translateX(0)}
.online-header{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 14px 10px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border);min-height:56px;backdrop-filter:blur(8px)}
.online-header .back{background:none;border:none;cursor:pointer;padding:4px;color:var(--text);display:flex}
.online-header .back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.online-header .title{font-weight:700;font-size:1em;flex:1}
.online-header .live-dot{display:flex;align-items:center;gap:5px;font-size:.7em;color:var(--success);font-weight:700}
.online-header .live-dot .dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(34,197,94,.18);animation:pulseDot 1.8s infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.4}}
.online-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.me-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--primary-bg);border:1px solid var(--primary);border-radius:var(--radius-sm);margin-bottom:14px}
.ou-avatar{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;flex-shrink:0;background-size:cover;background-position:center}
.ou-info{flex:1;min-width:0}
.ou-name{font-weight:700;font-size:.92em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ou-status{font-size:.72em;color:var(--success);display:flex;align-items:center;gap:5px;margin-top:2px;font-weight:600}
.ou-status .dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.section-label{font-size:.7em;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.06em;margin:6px 0 10px;display:flex;align-items:center;gap:6px}
.online-list{display:flex;flex-direction:column;gap:10px}
.online-user{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);animation:fadeInUp .3s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.online-user.me{border-color:var(--primary);background:var(--primary-bg)}
.empty-online{text-align:center;padding:70px 20px;color:var(--text-muted)}
.empty-online-icon{font-size:3.2em;opacity:.45;margin-bottom:14px}
.empty-online-title{font-size:.98em;font-weight:700;color:var(--text);margin-bottom:6px}
.empty-online-sub{font-size:.78em;color:var(--text-light);line-height:1.6}
@media (max-width:480px){.app-header{padding:10px 12px}.chat-messages{padding:12px 12px 4px}.fixed-input-area{padding:8px 12px calc(8px + var(--safe-b))}.pill-bar{padding:8px 12px 0}.chat-msg{max-width:90%}.user-area .user-name{max-width:54px;font-size:.72em}}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
</style>
</head>
<body>

<div id="mainApp">
  <div id="header-container"></div>
  <div class="banned-banner" id="bannedBanner">账号已被封禁，无法发送聊天消息。解封时间：<span id="bannedUntilDisplay"></span></div>
  <div class="app-content">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="pill-bar">
      <button class="pill-btn" id="roomPillBtn" type="button" onclick="location.href='/liuyanban/room.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/>
        </svg>
        房间
        <span class="pill-new">新</span>
      </button>
    </div>
    <div class="fixed-input-area">
      <div class="input-wrapper">
        <input type="text" id="chatInput" placeholder="说点什么…" maxlength="200" />
        <button id="sendChatBtn" type="button">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          <span class="btn-text">发送</span>
        </button>
      </div>
      <button class="admin-clear-btn" id="clearChatBtn" type="button">清空聊天</button>
    </div>
  </div>
  <div id="footer-container"></div>
</div>

<!-- 在线用户 overlay -->
<div class="online-overlay" id="onlineOverlay">
  <div class="online-header">
    <button class="back" id="onlineBackBtn" type="button">
      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <span class="title">在线用户</span>
    <span class="live-dot"><span class="dot"></span>实时</span>
  </div>
  <div class="online-body">
    <div class="online-list" id="onlineUserList"></div>
  </div>
</div>

<div class="custom-modal" id="confirmModal">
  <div class="modal-box">
    <div class="modal-title" id="confirmTitle">确认</div>
    <div class="modal-body" id="confirmBody">确定要执行此操作吗？</div>
    <div class="modal-actions">
      <button class="btn-secondary" id="confirmCancel" type="button">取消</button>
      <button class="btn-danger" id="confirmOk" type="button">确定</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/liuyanban/core/config.js"></script>
<script src="/liuyanban/core/util.js"></script>
<script src="/liuyanban/core/ui.js"></script>
<script src="/liuyanban/core/session.js"></script>
<script src="/liuyanban/core/data.js"></script>
<script src="/liuyanban/core/mods.js"></script>
<script src="/liuyanban/core/shell.js"></script>
<script src="/liuyanban/core/boot.js"></script>
<script src="/liuyanban/chats/chats.js"></script>
</body>
</html>
