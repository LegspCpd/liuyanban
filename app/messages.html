<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Seven戚 · 留言板</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        :root {
            --bg: #f5faf5;
            --bg-card: #ffffff;
            --bg-input: #eaf3ea;
            --border: #c8e0c8;
            --text: #1e3a2e;
            --text-muted: #5a7a6a;
            --text-light: #8aaa9a;
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --primary-glow: rgba(76, 175, 80, 0.25);
            --primary-bg: #e8f5e9;
            --shadow: 0 8px 32px rgba(46, 125, 50, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --font: "Space Grotesk", "PingFang SC", "Segoe UI", system-ui, sans-serif;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --danger: #e57373;
            --danger-bg: #ffebee;
            --official-blue: #2b6cff;
        }
        html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; }
        #mainApp { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: var(--bg); }

        .app-header {
            flex-shrink: 0; padding: 12px 20px 8px 20px;
            background: rgba(255,255,255,0.92);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            z-index: 50; min-height: 56px;
        }
        .app-header .brand { font-weight: 900; font-size: 1.1em; color: var(--text); display: flex; align-items: center; gap: 0.4em; }
        .app-header .brand span { color: var(--primary); }
        .app-header .brand small { font-weight: 400; font-size: 0.55em; color: var(--text-muted); margin-left: 0.3em; }
        .app-header .user-area { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 10px 4px 6px; border-radius: 99px; }
        .app-header .user-area:hover { background: var(--primary-bg); }
        .app-header .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; flex-shrink: 0; background-size: cover; background-position: center; }
        .app-header .user-name { font-weight: 600; font-size: 0.85em; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .app-header .chevron { color: var(--text-muted); font-size: 0.7em; }

        .app-tabs {
            flex-shrink: 0; display: flex;
            background: rgba(255,255,255,0.96);
            border-top: 1px solid var(--border);
            padding: 6px 0 calc(6px + var(--safe-bottom));
            z-index: 50;
        }
        .tab-btn {
            flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
            background: none; border: none; font-family: var(--font); font-size: 0.6em; font-weight: 600;
            color: var(--text-muted); padding: 4px 0; cursor: pointer; text-decoration: none;
            position: relative;
        }
        .tab-btn .tab-icon { font-size: 1.6em; line-height: 1.2; }
        .tab-btn.active { color: var(--primary); }
        .tab-btn.active::after { content: ''; position: absolute; top: -1px; left: 30%; right: 30%; height: 3px; background: var(--primary); border-radius: 0 0 4px 4px; }
        .tab-btn .badge { position: absolute; top: -2px; right: 15%; background: #e57373; color: #fff; font-size: 0.6em; font-weight: 700; padding: 1px 6px; border-radius: 99px; min-width: 16px; text-align: center; }

        .banned-banner { flex-shrink: 0; background: #ffebee; color: #c62828; padding: 6px 16px; font-size: 0.8em; font-weight: 600; text-align: center; border-bottom: 1px solid #ffcdd2; display: none; }
        .banned-banner.active { display: block; }

        .app-content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .msg-list { flex: 1; overflow-y: auto; padding: 16px 20px 8px 20px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }

        .fixed-input-area {
            flex-shrink: 0; padding: 10px 20px calc(10px + var(--safe-bottom));
            background: var(--bg); border-top: 1px solid var(--border);
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        }
        .fixed-input-area .input-wrapper { flex: 1; display: flex; gap: 8px; min-width: 0; }
        .fixed-input-area input {
            flex: 1; padding: 10px 14px; border-radius: 99px;
            border: 2px solid var(--border); background: var(--bg-input);
            font-family: inherit; font-size: 0.85em; outline: none; color: var(--text); min-width: 0;
        }
        .fixed-input-area input:focus { border-color: var(--primary); }
        .fixed-input-area input:disabled { opacity: 0.5; }
        .fixed-input-area button {
            padding: 8px 20px; border-radius: 99px; border: none;
            background: var(--primary); color: #fff; font-weight: 700; font-size: 0.85em;
            cursor: pointer; font-family: inherit; white-space: nowrap;
            display: flex; align-items: center; gap: 6px;
        }
        .fixed-input-area button:hover { background: var(--primary-light); }
        .fixed-input-area button:disabled { opacity: 0.5; pointer-events: none; }
        .fixed-input-area .author-options { display: none; align-items: center; gap: 12px; width: 100%; margin-top: 4px; }
        .fixed-input-area .author-options.active { display: flex; }
        .fixed-input-area .author-options label { font-size: 0.75em; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 4px; cursor: pointer; }

        .msg {
            display: flex; gap: 12px; padding: 14px;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-sm); flex-shrink: 0;
        }
        .msg .avatar {
            width: 38px; height: 38px; border-radius: 50%; flex: none;
            display: grid; place-items: center; font-weight: 700; font-size: 16px;
            color: #fff; background: var(--primary);
            background-size: cover; background-position: center;
        }
        .msg .body { flex: 1; min-width: 0; }
        .msg .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
        .msg .name { font-size: 14px; font-weight: 600; }
        .msg .official-tag { background: #2b6cff; color: #fff; font-size: 10px; font-weight: 600; padding: 0 8px; border-radius: 999px; line-height: 18px; }
        .msg .time { font-size: 11.5px; color: var(--text-muted); }
        .msg .txt { font-size: 14px; line-height: 1.6; color: var(--text); word-break: break-word; }
        .msg .ip { margin-top: 6px; font-size: 11.5px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .msg .ip .ip-text { display: flex; align-items: center; gap: 4px; }
        .msg .ip .comment-btn {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 13px; display: flex; align-items: center;
            gap: 4px; padding: 2px 6px; border-radius: 999px; font-family: inherit;
        }
        .msg .ip .comment-btn:hover { background: rgba(0,0,0,0.05); color: var(--text); }
        .msg .ip .comment-btn.official { color: var(--official-blue); }
        .msg .ip .report-btn {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 12px; opacity: 0.6;
            padding: 2px 6px; display: flex; align-items: center;
            gap: 4px; border-radius: 999px;
        }
        .msg .ip .report-btn:hover { opacity: 1; color: var(--danger); }
        .msg .ip .del-btn {
            background: none; border: none; color: #e57373;
            cursor: pointer; font-size: 13px; opacity: 0.6;
            padding: 0 4px; margin-left: auto;
            display: flex; align-items: center; gap: 4px;
        }
        .msg .ip .del-btn:hover { opacity: 1; }
        .msg.pinned { border-color: var(--primary); box-shadow: 0 0 12px var(--primary-glow); }

        .icon-svg { width: 1em; height: 1em; fill: currentColor; flex-shrink: 0; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 0.85em; }
        .empty-state .big { font-size: 2.8em; margin-bottom: 8px; opacity: 0.5; }
        .loading-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 0.9em; }
        .loading-state .spinner {
            display: inline-block; width: 30px; height: 30px;
            border: 3px solid var(--border); border-top-color: var(--primary);
            border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-state { text-align: center; color: #c62828; padding: 40px 20px; font-size: 0.9em; }

        #toast {
            position: fixed; bottom: 80px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--text); color: #fff;
            padding: 0.7em 1.6em; border-radius: 2em;
            font-weight: 600; font-size: 0.85em;
            opacity: 0; transition: all 0.4s ease;
            z-index: 9999; pointer-events: none;
            white-space: nowrap; box-shadow: var(--shadow);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 480px) {
            .app-header { padding: 10px 14px 6px 14px; min-height: 48px; }
            .app-header .brand { font-size: 0.95em; }
            .app-header .user-name { max-width: 60px; font-size: 0.75em; }
            .msg-list { padding: 12px 14px 4px 14px; }
            .fixed-input-area { padding: 8px 14px calc(8px + var(--safe-bottom)); flex-direction: column; align-items: stretch; }
            .fixed-input-area .input-wrapper { flex: 1; }
            .fixed-input-area input { padding: 8px 12px; font-size: 0.8em; }
            .fixed-input-area button { padding: 6px 14px; font-size: 0.8em; }
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* 评论弹窗 */
        .comment-overlay {
            position: fixed; inset: 0; z-index: 999;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center; padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .comment-overlay.active { display: flex; }
        .comment-panel {
            background: var(--bg-card); border-radius: var(--radius);
            max-width: 560px; width: 100%; max-height: 80vh; padding: 24px;
            display: flex; flex-direction: column; border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .comment-header h4 { font-size: 1.1em; display: flex; align-items: center; gap: 6px; }
        .comment-close { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; display: flex; }
        .comment-close:hover { color: var(--text); }
        .comment-list { flex: 1; overflow-y: auto; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; max-height: 50vh; }
        .comment-item {
            background: var(--bg-input); border-radius: var(--radius-sm);
            padding: 10px 12px; border-left: 3px solid var(--border);
        }
        .comment-item.official { border-left-color: #2b6cff; background: rgba(43,108,255,0.06); }
        .comment-item .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.8em; color: var(--text-muted); }
        .comment-item .meta .name { font-weight: 700; color: var(--text); }
        .comment-item .meta .official-tag { background: #2b6cff; color: #fff; font-size: 0.55em; padding: 0 6px; border-radius: 99px; line-height: 16px; }
        .comment-item .txt { font-size: 0.9em; line-height: 1.5; margin-top: 4px; color: var(--text); }
        .comment-item .time { font-size: 0.7em; color: var(--text-light); }
        .comment-item .del-comment-btn { background: none; border: none; color: #e57373; cursor: pointer; padding: 0 4px; margin-left: auto; display: flex; align-items: center; }
        .comment-input-area { display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 12px; }
        .comment-input-area input {
            flex: 1; padding: 8px 14px; border-radius: 99px;
            border: 2px solid var(--border); background: var(--bg-input);
            font-family: inherit; font-size: 0.85em; outline: none; color: var(--text);
        }
        .comment-input-area input:focus { border-color: var(--primary); }
        .comment-input-area input:disabled { opacity: 0.5; }
        .comment-input-area button {
            padding: 8px 18px; border-radius: 99px; border: none;
            background: var(--primary); color: #fff; font-weight: 700; font-size: 0.85em;
            cursor: pointer; font-family: inherit; white-space: nowrap;
            display: flex; align-items: center; gap: 6px;
        }
        .comment-input-area button:hover { background: var(--primary-light); }
        .comment-input-area button:disabled { opacity: 0.5; pointer-events: none; }
        .comment-empty { text-align: center; color: var(--text-muted); padding: 20px 0; font-size: 0.85em; }

        /* 确认弹窗 */
        .custom-modal {
            position: fixed; inset: 0; z-index: 2000;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .custom-modal.active { display: flex; }
        .custom-modal .modal-box {
            background: var(--bg-card); border-radius: var(--radius);
            max-width: 420px; width: 100%; padding: 24px;
            box-shadow: var(--shadow); border: 1px solid var(--border);
        }
        .custom-modal .modal-title { font-size: 1.2em; font-weight: 700; margin-bottom: 8px; color: var(--text); }
        .custom-modal .modal-body { font-size: 0.95em; color: var(--text-muted); line-height: 1.6; margin-bottom: 16px; white-space: pre-wrap; }
        .custom-modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .custom-modal .modal-actions button {
            padding: 6px 18px; border-radius: var(--radius-sm);
            border: none; font-weight: 600; font-size: 0.85em;
            cursor: pointer; font-family: inherit;
        }
        .custom-modal .modal-actions .btn-danger { background: var(--danger); color: #fff; }
        .custom-modal .modal-actions .btn-danger:hover { background: #c62828; }
        .custom-modal .modal-actions .btn-secondary { background: var(--bg-input); color: var(--text-muted); }
        .custom-modal .modal-actions .btn-secondary:hover { background: var(--border); }
    </style>
</head>
<body>
    <div id="mainApp">
        <div id="header-container"></div>

        <div class="banned-banner" id="bannedBanner">
            账号已被封禁，无法发布留言或评论。解封时间：<span id="bannedUntilDisplay"></span>
        </div>

        <div class="app-content">
            <div class="msg-list" id="messageList"></div>
            <div class="fixed-input-area" id="messageInputArea">
                <div class="input-wrapper">
                    <input type="text" id="msgInput" placeholder="写留言…" maxlength="200" />
                    <button id="sendMsgBtn" onclick="sendMessage()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                        <span class="btn-text">发送</span>
                    </button>
                </div>
                <div class="author-options" id="msgAuthorOptions">
                    <label><input type="checkbox" id="msgPinnedCheck"> 置顶</label>
                    <span style="font-size:0.65em;color:var(--text-muted);">(仅作者)</span>
                </div>
            </div>
        </div>

        <div id="footer-container"></div>
    </div>

    <!-- 评论弹窗 -->
    <div class="comment-overlay" id="commentOverlay">
        <div class="comment-panel">
            <div class="comment-header">
                <h4>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    评论
                </h4>
                <button class="comment-close" id="closeComment">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="comment-list" id="commentList"></div>
            <div class="comment-input-area">
                <input type="text" id="commentInput" placeholder="写评论…" maxlength="200" />
                <button id="sendCommentBtn" onclick="sendComment()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                    <span class="btn-text">发送</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 确认弹窗 -->
    <div class="custom-modal" id="confirmModal">
        <div class="modal-box">
            <div class="modal-title" id="confirmTitle">确认</div>
            <div class="modal-body" id="confirmBody">确定要执行此操作吗？</div>
            <div class="modal-actions">
                <button class="btn-secondary" id="confirmCancel">取消</button>
                <button class="btn-danger" id="confirmOk">确定</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script src="/liuyanban/core/config.js"></script>
<script src="/liuyanban/core/util.js"></script>
<script src="/liuyanban/core/ui.js"></script>
<script src="/liuyanban/core/session.js"></script>
<script src="/liuyanban/core/data.js"></script>
<script src="/liuyanban/core/mods.js"></script>
<script src="/liuyanban/core/shell.js"></script>
<script src="/liuyanban/core/boot.js"></script>
    <script src="/liuyanban/messages/messages.js"></script>
</body>
</html>
