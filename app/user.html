<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Seven戚 · 用户主页</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root{
  --bg:#f5faf5; --bg-card:#fff; --bg-input:#eaf3ea; --border:#c8e0c8;
  --text:#1e3a2e; --text-muted:#5a7a6a; --text-light:#8aaa9a;
  --primary:#2e7d32; --primary-light:#4caf50; --primary-bg:#e8f5e9;
  --shadow:0 8px 32px rgba(46,125,50,.12); --radius:16px; --radius-sm:10px;
  --font:"Space Grotesk","PingFang SC","Segoe UI",system-ui,sans-serif;
  --danger:#e57373; --danger-bg:#ffebee;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden}
#mainApp{display:flex;flex-direction:column;height:100vh;height:100dvh}
.app-header{flex-shrink:0;padding:12px 20px 8px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;z-index:50;min-height:56px}
.brand{font-weight:800;font-size:1.15em;color:var(--text);cursor:pointer}
.brand span{color:var(--primary)}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{background:none;border:none;cursor:pointer;padding:6px;color:var(--text);display:flex;border-radius:8px}

.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{background:var(--primary-bg)}
.user-area{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:99px}
.user-area:hover{background:var(--primary-bg)}
.user-area .avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;background-size:cover;background-position:center;flex-shrink:0}
.user-area .user-name{font-size:.85em;font-weight:600}
.user-area .chevron{font-size:.7em;color:var(--text-light)}
.page-content{flex:1;overflow-y:auto;padding:16px 16px 80px}
.footer-container{flex-shrink:0}

/* 资料卡 */
.profile-hero{background:linear-gradient(135deg,#2e7d32,#4caf50);border-radius:var(--radius);padding:24px 20px 20px;color:#fff;position:relative;overflow:hidden}
.profile-hero::after{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;background:rgba(255,255,255,.1);border-radius:50%}

.hero-main{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.hero-avatar{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.25);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:800;background-size:cover;background-position:center;flex-shrink:0;border:3px solid rgba(255,255,255,.5)}
.hero-info{flex:1;min-width:0}
.hero-name{font-size:1.35em;font-weight:800;margin-bottom:8px}
.hero-stats{display:flex;gap:22px;align-items:baseline}
.hero-stat{display:flex;align-items:baseline;gap:4px}
.hero-stat .num{font-size:1.1em;font-weight:800}
.hero-stat .lbl{font-size:.72em;opacity:.85}
.hero-line2{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:.72em;opacity:.85}
.hero-no{opacity:.9}
.hero-gender{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:.92em}
.hero-gender.male{background:rgba(64,150,255,.9);color:#fff}
.hero-gender.female{background:rgba(255,105,160,.9);color:#fff}
.hero-gender svg{display:block}
.hero-bio{font-size:.84em;opacity:.92;margin-top:14px;line-height:1.6;position:relative;z-index:1;word-break:break-word;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}
.hero-actions{display:flex;gap:10px;margin-top:16px;position:relative;z-index:1}
.btn-follow{flex:1;padding:11px;border:2px solid #fff;border-radius:10px;font-weight:800;font-family:inherit;font-size:.9em;cursor:pointer;background:#fff;color:var(--primary)}
.btn-follow.following{background:transparent;color:#fff}
.btn-edit-profile{flex:1;padding:11px;border:2px solid #fff;border-radius:10px;font-weight:800;font-family:inherit;font-size:.9em;cursor:pointer;background:#fff;color:var(--primary)}


/* 六宫格导航 */
.nav-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 4px}
.nav-cell{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:all .18s;text-align:center}
.nav-cell:hover{border-color:var(--primary);background:var(--primary-bg)}
.nav-cell:active{transform:scale(.97)}
.nav-cell .ic{width:40px;height:40px;border-radius:50%;background:var(--primary-bg);display:grid;place-items:center;color:var(--primary)}
.nav-cell .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-cell .tx{font-size:.78em;font-weight:700;color:var(--text)}
.nav-cell .sub{font-size:.62em;color:var(--text-light);margin-top:-4px}
/* Tab */
.tabs{display:flex;gap:8px;margin:16px 0 12px;border-bottom:1px solid var(--border)}
.tab{padding:10px 4px;border:none;background:none;font-family:inherit;font-size:.88em;font-weight:700;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-right:8px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

/* 帖子卡 */
.post-card{background:var(--bg-card);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(46,125,50,.05);cursor:pointer}
.post-card .post-title{font-weight:700;font-size:.95em;margin-bottom:6px}
.post-card .post-body{font-size:.82em;color:var(--text-muted);line-height:1.5;max-height:60px;overflow:hidden}
.post-card .post-foot{font-size:.7em;color:var(--text-light);margin-top:8px;display:flex;gap:12px}
.empty{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:.85em}
.loading-state{text-align:center;padding:40px 20px}
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 编辑弹窗 */
.edit-modal{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
.edit-modal.active{display:flex}
.edit-box{background:#fff;border-radius:var(--radius);padding:22px 20px;max-width:400px;width:100%;max-height:86vh;overflow-y:auto}
.edit-box h3{font-size:1.05em;margin-bottom:16px}
.edit-field{margin-bottom:14px}
.edit-field label{display:block;font-size:.78em;font-weight:700;color:var(--text-muted);margin-bottom:6px}
.edit-field input,.edit-field select,.edit-field textarea{width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:10px;font-family:inherit;font-size:.88em;outline:none;background:var(--bg-input);color:var(--text);box-sizing:border-box}
.edit-field textarea{min-height:70px;resize:vertical}
.edit-field input:focus,.edit-field textarea:focus,.edit-field select:focus{border-color:var(--primary)}
.edit-actions{display:flex;gap:10px;margin-top:8px}
.edit-actions button{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;font-family:inherit;font-size:.88em;cursor:pointer}
.edit-actions .cancel{background:var(--bg-input);color:var(--text-muted)}
.edit-actions .ok{background:var(--primary);color:#fff}
.logout-btn{width:100%;margin-top:10px;padding:11px;border:1px solid var(--danger);border-radius:10px;background:var(--danger-bg);color:var(--danger);font-weight:700;font-family:inherit;font-size:.88em;cursor:pointer}

/* 头像上传 */
.avatar-edit{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.avatar-edit .av{width:64px;height:64px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;background-size:cover;background-position:center;flex-shrink:0}
.avatar-edit label{font-size:.8em;color:var(--primary);font-weight:700;cursor:pointer;text-decoration:underline}

/* 底部导航 */
.app-tabs{flex-shrink:0;display:flex;background:rgba(255,255,255,.96);border-top:1px solid var(--border);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:50}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;font-family:var(--font);font-size:.6em;font-weight:600;color:var(--text-muted);padding:4px 0;cursor:pointer;text-decoration:none;position:relative}
.tab-btn .tab-icon{font-size:1.6em;line-height:1.2;display:flex;align-items:center;justify-content:center;width:1.7em;height:1.7em}
.tab-btn .tab-icon svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none}
.tab-btn.active{color:var(--primary)}
.tab-btn.active::after{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;background:var(--primary);border-radius:0 0 4px 4px}
.tab-btn .badge{position:absolute;top:-2px;right:15%;background:#e57373;color:#fff;font-size:.6em;font-weight:700;padding:1px 6px;border-radius:99px;min-width:16px;text-align:center}
/* 顶部 header 结构（renderHeader 生成） */
.app-header .brand{font-weight:800;font-size:1.15em;color:var(--text);cursor:pointer}
.app-header .brand span{color:var(--primary)}
.app-header .brand small{font-size:.6em;color:var(--text-muted);font-weight:600}
.app-header .user-area{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:99px}
.app-header .user-area .avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;background-size:cover;background-position:center}
.app-header .user-area .user-name{font-size:.85em;font-weight:600}
.app-header .user-area .chevron{font-size:.7em;color:var(--text-light)}
/* 个人页设置齿轮靠右 */

/* 确认弹窗 */
.custom-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px}
.custom-modal.active{display:flex}
.modal-box{background:var(--bg-card);padding:24px;border-radius:var(--radius);max-width:400px;width:100%;box-shadow:var(--shadow)}
.modal-title{font-size:1.2em;font-weight:700;margin-bottom:8px;color:var(--text)}
.modal-body{font-size:.95em;color:var(--text-muted);line-height:1.6;margin-bottom:16px;white-space:pre-wrap}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.modal-actions button{padding:9px 20px;border:none;border-radius:8px;font-weight:700;font-family:inherit;font-size:.85em;cursor:pointer}
.modal-actions .btn-danger{background:var(--danger);color:#fff}
.modal-actions .btn-secondary{background:var(--bg-input);color:var(--text-muted)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.82);color:#fff;padding:10px 20px;border-radius:10px;font-size:.85em;opacity:0;pointer-events:none;transition:all .3s;z-index:9999;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="mainApp">
  <div id="header-container"></div>
  <div class="page-content" id="pageContent">
    <div class="loading-state"><div class="spinner"></div>加载中...</div>
  </div>
  <div class="footer-container" id="footer-container"></div>
</div>

<!-- 编辑资料弹窗 -->
<div class="edit-modal" id="editModal">
  <div class="edit-box">
    <h3>编辑资料</h3>
    <div class="avatar-edit">
      <div class="av" id="editAvatar">U</div>
      <div>
        <label for="editAvatarInput">更换头像</label>
        <input type="file" id="editAvatarInput" accept="image/*" style="display:none" />
      </div>
    </div>
    <div class="edit-field"><label>昵称</label><input type="text" id="editNickname" maxlength="12" /></div>
    <div class="edit-field"><label>简介</label><textarea id="editBio" maxlength="100" placeholder="介绍一下自己…"></textarea></div>
    <div class="edit-field"><label>性别</label><select id="editGender"><option value="">保密</option><option value="男">男</option><option value="女">女</option></select></div>
    <div class="edit-field"><label>生日</label><input type="date" id="editBirthday" /></div>
    <div class="edit-actions">
      <button class="cancel" onclick="closeEdit()">取消</button>
      <button class="ok" onclick="saveProfile()">保存</button>
    </div>
    <button class="logout-btn" onclick="doLogout()">退出登录</button>
  </div>
</div>

<div class="custom-modal" id="confirmModal">
  <div class="modal-box">
    <div class="modal-title" id="confirmTitle"></div>
    <div class="modal-body" id="confirmBody"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="confirmCancel">取消</button>
      <button class="btn-danger" id="confirmOk">确定</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="/liuyanban/core/config.js"></script>
<script src="/liuyanban/core/util.js"></script>
<script src="/liuyanban/core/ui.js"></script>
<script src="/liuyanban/core/session.js"></script>
<script src="/liuyanban/core/data.js"></script>
<script src="/liuyanban/core/mods.js"></script>
<script src="/liuyanban/core/shell.js"></script>
<script src="/liuyanban/core/boot.js"></script>
<script src="/liuyanban/user/user.js"></script>
</body>
</html>
