<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>房间 · Seven戚</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5faf5;--bg-card:#fff;--bg-input:#eaf3ea;--border:#c8e0c8;--text:#1e3a2e;--text-muted:#5a7a6a;--text-light:#8aaa9a;--primary:#2e7d32;--primary-light:#4caf50;--primary-bg:#e8f5e9;--shadow:0 8px 32px rgba(46,125,50,.12);--radius-sm:10px;--font:"Space Grotesk","PingFang SC","Segoe UI",system-ui,sans-serif;--danger:#e57373;--danger-bg:#ffebee;--danger-text:#c62828;--warning:#ffa726;--official-blue:#2b6cff;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}

.view-list,.view-detail{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.view-list.hidden{transform:translateX(-30%);opacity:.5;pointer-events:none}
.view-detail{transform:translateX(100%)}
.view-detail.open{transform:translateX(0)}

.page-header{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 14px 10px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border);min-height:56px;backdrop-filter:blur(8px);z-index:10}
.page-header .back{background:none;border:none;cursor:pointer;padding:4px;color:var(--text);display:flex;flex-shrink:0}
.page-header .back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.page-header .title{font-weight:700;font-size:1em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-action{background:var(--primary);color:#fff;border:none;border-radius:99px;padding:7px 15px;font-size:.75em;font-weight:700;cursor:pointer;font-family:inherit;display:none;flex-shrink:0}
.header-action.show{display:inline-flex}
.header-action.ghost{background:var(--bg-input);color:var(--text-muted)}

/* 房间列表 */
.room-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.room-card{position:relative;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:.2s;min-height:126px;justify-content:center;text-align:center}
.room-card:hover{border-color:var(--primary);box-shadow:var(--shadow);transform:translateY(-2px)}
.room-card-icon{font-size:1.9em;line-height:1;color:var(--primary)}
.room-card-icon svg{width:44px;height:44px;stroke:currentColor;fill:none;stroke-width:1.5}
.room-card-name{font-weight:700;font-size:.9em;line-height:1.3;word-break:break-word;max-width:100%}
.room-card-meta{font-size:.66em;color:var(--text-muted)}
.room-card-badge{position:absolute;top:8px;left:8px;background:var(--official-blue);color:#fff;font-size:.55em;font-weight:700;padding:1px 7px;border-radius:99px;line-height:15px}
.room-edit-btn{position:absolute;top:6px;right:6px;background:var(--bg-input);border:none;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;cursor:pointer;color:var(--text-muted);padding:0}
.room-edit-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.room-edit-btn:hover{background:var(--primary);color:#fff}
.empty-state{grid-column:1/-1;text-align:center;color:var(--text-muted);padding:60px 20px;font-size:.85em}
.empty-state .big{font-size:2.8em;margin-bottom:8px;opacity:.5}
.loading-state{grid-column:1/-1;text-align:center;color:var(--text-muted);padding:40px 20px;font-size:.9em}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ★ 房间主体：主题过渡 */
.room-body{flex:1;min-height:0;display:flex;flex-direction:column;transition:background .8s cubic-bezier(.4,0,.2,1),color .5s ease;background:linear-gradient(135deg,#f5faf5 0%,#e8f5e9 100%)}
.room-body[data-theme="gomoku"]{background:linear-gradient(135deg,#f5faf5 0%,#e8f5e9 100%);color:var(--text)}
.room-body[data-theme="draw"]{background:linear-gradient(135deg,#e3f2fd 0%,#bbdefb 35%,#90caf9 70%,#ffffff 100%);background-size:200% 200%;animation:drawBgFlow 10s ease infinite;color:#0d47a1}
.room-body[data-theme="spy"]{background:linear-gradient(135deg,#1a0f2a 0%,#2a1a3a 50%,#0d0818 100%);color:#e0d5f0}
.room-body[data-theme="werewolf"]{background:linear-gradient(135deg,#3a0a0a 0%,#1a0505 50%,#0d0202 100%);color:#e0d5d5}
@keyframes drawBgFlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.stage-wrap{flex-shrink:0;padding:12px 14px 0;position:relative;z-index:1}

/* 麦位 */
.mic-panel{background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;backdrop-filter:blur(8px)}
.room-body[data-theme="spy"] .mic-panel,.room-body[data-theme="werewolf"] .mic-panel{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
.mic-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mic-title{font-size:.8em;font-weight:700}
.mic-mode{font-size:.65em;color:var(--primary);background:var(--primary-bg);padding:2px 10px;border-radius:99px;font-weight:700}
.room-body[data-theme="spy"] .mic-mode{background:rgba(180,140,255,.2);color:#c8a5ff}
.room-body[data-theme="werewolf"] .mic-mode{background:rgba(255,140,140,.2);color:#ffb5b5}
.mic-off{font-size:.75em;color:var(--text-muted);text-align:center;padding:10px 0}
.mic-seats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mic-seat{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:10px;background:rgba(255,255,255,.7);border:1.5px dashed var(--border)}
.room-body[data-theme="spy"] .mic-seat,.room-body[data-theme="werewolf"] .mic-seat{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
.mic-seat.on{background:var(--primary-bg);border-style:solid;border-color:var(--primary)}
.room-body[data-theme="spy"] .mic-seat.on,.room-body[data-theme="werewolf"] .mic-seat.on{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.5)}
.mic-avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;background-size:cover;background-position:center}
.mic-avatar.empty{background:#dfe9df;color:var(--text-light);font-size:18px}
.mic-name{font-size:.62em;color:var(--text-muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mic-seat.on .mic-name{color:var(--text)}
.room-body[data-theme="spy"] .mic-seat.on .mic-name,.room-body[data-theme="werewolf"] .mic-seat.on .mic-name{color:inherit}
.mic-x{position:absolute;top:1px;right:1px;background:none;border:none;color:var(--danger);cursor:pointer;font-size:11px;padding:0 3px;line-height:1}
.mic-actions{display:flex;gap:8px;margin-top:10px}
.mic-btn{flex:1;padding:8px;border-radius:99px;border:none;font-family:inherit;font-weight:700;font-size:.78em;cursor:pointer}
.mic-btn.join{background:var(--primary);color:#fff}
.mic-btn.leave{background:var(--danger-bg);color:var(--danger-text)}
.mic-btn.waiting{background:var(--warning);color:#fff}
.mic-queue{margin-top:10px;border-top:1px dashed var(--border);padding-top:8px}
.mic-queue-title{font-size:.68em;color:var(--text-muted);font-weight:700;margin-bottom:6px}
.mic-queue-item{display:flex;align-items:center;gap:6px;font-size:.75em;padding:5px 8px;background:rgba(255,255,255,.5);border-radius:8px;margin-bottom:5px}
.mic-queue-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mic-queue-item button{border:none;border-radius:99px;padding:3px 10px;font-size:.85em;font-weight:700;cursor:pointer;font-family:inherit}
.mic-queue-item button:first-of-type{background:var(--primary);color:#fff}
.mic-queue-item button:last-of-type{background:var(--danger-bg);color:var(--danger-text)}

/* ★ 游戏舞台 */
.game-stage{display:none;background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;backdrop-filter:blur(10px)}
.room-body[data-theme="spy"] .game-stage,.room-body[data-theme="werewolf"] .game-stage{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15)}
.game-stage.active{display:block}
.game-topbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid rgba(0,0,0,.06)}
.room-body[data-theme="spy"] .game-topbar,.room-body[data-theme="werewolf"] .game-topbar{border-bottom-color:rgba(255,255,255,.12)}
.gpm-players{display:flex;align-items:center;gap:6px;flex:1;overflow-x:auto;padding:2px 0}
.gpm-player{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.05);border-radius:99px;padding:3px 10px 3px 3px;flex-shrink:0}
.room-body[data-theme="spy"] .gpm-player,.room-body[data-theme="werewolf"] .gpm-player{background:rgba(255,255,255,.1)}
.gpm-avatar{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:10px;background-size:cover;background-position:center;flex-shrink:0}
.gpm-name{font-size:.68em;font-weight:700;white-space:nowrap;max-width:60px;overflow:hidden;text-overflow:ellipsis}
.gpm-turn{box-shadow:0 0 0 2px var(--primary);animation:pulseTurn 1.5s infinite}
@keyframes pulseTurn{0%,100%{box-shadow:0 0 0 2px var(--primary)}50%{box-shadow:0 0 0 4px rgba(46,125,50,.3)}}
.fs-btn{background:rgba(0,0,0,.06);border:none;border-radius:8px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;color:inherit;flex-shrink:0}
.room-body[data-theme="spy"] .fs-btn,.room-body[data-theme="werewolf"] .fs-btn{background:rgba(255,255,255,.12)}
.fs-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.fs-btn:hover{background:var(--primary);color:#fff}
.game-content{padding:10px;min-height:180px;max-height:60vh;overflow-y:auto;position:relative}

/* 五子棋 */
.gomoku-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.gomoku-status{font-size:.82em;font-weight:700;text-align:center;min-height:20px}
.gomoku-board{display:grid;grid-template-columns:repeat(15,1fr);width:min(82vw,340px);aspect-ratio:1;background:#dcb35c;border-radius:8px;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.gmk-cell{position:relative;display:flex;align-items:center;justify-content:center;border:.5px solid rgba(90,60,20,.45);cursor:pointer}
.gmk-cell:active{background:rgba(255,255,255,.25)}
.gmk-stone{width:84%;height:84%;border-radius:50%;display:block;box-shadow:0 1px 3px rgba(0,0,0,.35);animation:stoneIn .16s ease}
@keyframes stoneIn{from{transform:scale(.4);opacity:.4}to{transform:scale(1);opacity:1}}
.gmk-stone.black{background:radial-gradient(circle at 32% 32%,#6a6a6a,#000)}
.gmk-stone.white{background:radial-gradient(circle at 32% 32%,#fff,#b9b9b9)}

/* 你画我猜 */
.draw-wrap{display:flex;flex-direction:column;gap:10px}
.draw-info{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.8em;font-weight:700}
.draw-word{background:linear-gradient(135deg,#1976d2,#42a5f5);color:#fff;padding:5px 14px;border-radius:99px;font-size:1.05em;letter-spacing:2px}
.draw-word.hidden-word{background:rgba(255,255,255,.35);color:#1976d2;letter-spacing:6px}
.draw-canvas-wrap{position:relative;width:100%;background:#fff;border-radius:10px;overflow:hidden;border:2px solid #90caf9}
.draw-canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
.draw-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.draw-color{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15);cursor:pointer}
.draw-color.active{box-shadow:0 0 0 3px #1976d2}
.draw-size{background:#fff;border:2px solid #90caf9;color:#1976d2;font-weight:700;padding:4px 10px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.75em}
.draw-size.active{background:#1976d2;color:#fff;border-color:#1976d2}
.draw-guess-box{display:flex;gap:6px}
.draw-guess-box input{flex:1;padding:8px 12px;border:2px solid #90caf9;border-radius:10px;font-family:inherit;font-size:.85em;outline:none;background:#fff;color:#0d47a1}
.draw-guess-box button{padding:8px 16px;border:none;background:#1976d2;color:#fff;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.8em}
.draw-messages{max-height:80px;overflow-y:auto;font-size:.75em;background:rgba(255,255,255,.5);border-radius:8px;padding:6px 10px}
.draw-msg{margin-bottom:3px;color:#0d47a1}
.draw-msg.correct{color:#2e7d32;font-weight:700}

/* 谁是卧底 */
.spy-wrap{display:flex;flex-direction:column;gap:10px;color:#e0d5f0}
.spy-role-card{background:linear-gradient(135deg,rgba(180,140,255,.2),rgba(120,80,200,.15));border:2px solid rgba(200,160,255,.4);border-radius:12px;padding:14px;text-align:center;backdrop-filter:blur(8px)}
.spy-role-label{font-size:.65em;text-transform:uppercase;letter-spacing:.1em;opacity:.7;margin-bottom:4px}
.spy-role-word{font-size:1.4em;font-weight:900;letter-spacing:4px;background:linear-gradient(135deg,#c8a5ff,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.spy-desc{font-size:.72em;opacity:.75;margin-top:6px}
.spy-players{display:flex;flex-direction:column;gap:6px}
.spy-player{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,.06);border-radius:10px;border:1px solid rgba(255,255,255,.1)}
.spy-player.eliminated{opacity:.4;text-decoration:line-through}
.spy-player .gpm-avatar{width:26px;height:26px}
.spy-player .name{flex:1;font-size:.82em;font-weight:700}
.spy-player .vote-btn{background:rgba(200,160,255,.25);color:#e0d5f0;border:none;padding:4px 12px;border-radius:99px;font-size:.72em;font-weight:700;cursor:pointer;font-family:inherit}
.spy-player .vote-btn:hover{background:#8b5cf6;color:#fff}
.spy-desc-input{display:flex;gap:6px;margin-top:6px}
.spy-desc-input input{flex:1;padding:8px 12px;border:2px solid rgba(200,160,255,.3);border-radius:10px;font-family:inherit;font-size:.82em;outline:none;background:rgba(255,255,255,.08);color:#e0d5f0}
.spy-desc-input input::placeholder{color:rgba(224,213,240,.4)}
.spy-desc-input button{padding:8px 16px;border:none;background:#8b5cf6;color:#fff;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.8em}
.spy-timeline{font-size:.72em;opacity:.8;background:rgba(255,255,255,.05);border-radius:8px;padding:8px 10px;max-height:80px;overflow-y:auto}
.spy-line{padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.08)}

/* 狼人杀 */
.ww-wrap{display:flex;flex-direction:column;gap:10px;color:#e0d5d5}
.ww-role-card{background:linear-gradient(135deg,rgba(200,50,50,.25),rgba(80,10,10,.2));border:2px solid rgba(255,140,140,.4);border-radius:12px;padding:14px;text-align:center;backdrop-filter:blur(8px)}
.ww-role-label{font-size:.65em;text-transform:uppercase;letter-spacing:.1em;opacity:.75;margin-bottom:4px}
.ww-role-word{font-size:1.4em;font-weight:900;letter-spacing:4px;background:linear-gradient(135deg,#ffb5b5,#ff5252);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ww-desc{font-size:.72em;opacity:.8;margin-top:6px}
.ww-phase{font-size:.85em;font-weight:700;text-align:center;padding:6px;border-radius:8px;background:rgba(255,255,255,.06)}
.ww-players{display:flex;flex-direction:column;gap:6px}
.ww-player{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,.06);border-radius:10px;border:1px solid rgba(255,255,255,.1)}
.ww-player.dead{opacity:.4;text-decoration:line-through}
.ww-player .name{flex:1;font-size:.82em;font-weight:700}
.ww-player .btn{background:rgba(255,140,140,.25);color:#ffb5b5;border:none;padding:4px 12px;border-radius:99px;font-size:.72em;font-weight:700;cursor:pointer;font-family:inherit}
.ww-player .btn:hover{background:#ff5252;color:#fff}

/* 房间消息 */
.room-messages{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;position:relative;z-index:1}
.rm-msg{display:flex;gap:9px;flex-shrink:0;max-width:92%}
.rm-msg.self{align-self:flex-end;flex-direction:row-reverse}
.rm-avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0;background-size:cover;background-position:center}
.rm-bubble{background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.06);border-radius:12px;padding:7px 11px;min-width:0}
.room-body[data-theme="spy"] .rm-bubble,.room-body[data-theme="werewolf"] .rm-bubble{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15)}
.rm-msg.self .rm-bubble{background:var(--primary-bg);border-color:var(--primary)}
.rm-name{font-size:.66em;color:var(--text-muted);font-weight:700;margin-bottom:2px}
.rm-text{font-size:.84em;line-height:1.5;word-break:break-word}

/* 输入区 */
.room-input-area{flex-shrink:0;display:flex;gap:8px;align-items:center;padding:10px 14px calc(10px + var(--safe-b));background:rgba(255,255,255,.9);border-top:1px solid var(--border);backdrop-filter:blur(8px);z-index:2}
.room-input-area input{flex:1;padding:10px 14px;border-radius:99px;border:2px solid var(--border);background:var(--bg-input);font-family:inherit;font-size:.85em;outline:none;min-width:0;color:var(--text)}
.room-input-area input:focus{border-color:var(--primary)}
.room-input-area .game-btn{background:var(--bg-card);border:2px solid var(--border);color:var(--text);padding:8px 14px;border-radius:99px;font-size:.78em;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;display:flex;align-items:center;gap:4px}
.room-input-area .game-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.room-input-area .game-btn:hover{border-color:var(--primary);color:var(--primary)}
.room-input-area .send-btn{background:var(--primary);color:#fff;border:none;padding:9px 16px;border-radius:99px;font-weight:700;font-size:.8em;cursor:pointer;font-family:inherit}

/* ★ 游戏抽屉 */
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:399}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.game-drawer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:8px 16px calc(20px + var(--safe-b));transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:400;max-height:70vh;overflow-y:auto;box-shadow:0 -8px 32px rgba(0,0,0,.15)}
.game-drawer.open{transform:translateY(0)}
.drawer-handle{width:44px;height:5px;background:#ddd;border-radius:99px;margin:0 auto 12px}
.drawer-title{font-size:1em;font-weight:800;margin-bottom:14px;text-align:center}
.game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.game-card{background:var(--bg);border:2px solid var(--border);border-radius:14px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:.2s;text-align:center}
.game-card:hover{border-color:var(--primary);background:var(--primary-bg);transform:translateY(-2px)}
.game-card.active{border-color:var(--primary);background:var(--primary-bg);box-shadow:0 0 0 3px rgba(46,125,50,.15)}
.game-card-icon{width:44px;height:44px;display:grid;place-items:center;color:var(--primary)}
.game-card-icon svg{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.game-card-name{font-weight:800;font-size:.9em}
.game-card-desc{font-size:.66em;color:var(--text-muted)}

/* 房间设置弹窗 */
.re-overlay{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
.re-panel{background:#fff;border-radius:16px;max-width:480px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.25)}
.re-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.re-head h3{font-size:1.02em;margin:0;font-weight:800}
.re-head button{background:none;border:none;cursor:pointer;color:var(--text-light);padding:4px}
.re-head button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.re-body{padding:16px 18px;overflow-y:auto;flex:1}
.re-field{margin-bottom:16px}
.re-field>label{display:block;font-size:.72em;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.re-field input[type=text]{width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:10px;font-family:inherit;font-size:.9em;outline:none;box-sizing:border-box;color:var(--text);background:var(--bg-input)}
.re-field input[type=text]:focus{border-color:var(--primary)}
.re-radio-row{display:flex;gap:8px;flex-wrap:wrap}
.re-radio{flex:1;min-width:120px;display:flex;align-items:center;gap:7px;padding:10px 12px;border:2px solid var(--border);border-radius:10px;font-size:.8em;font-weight:600;cursor:pointer}
.re-radio input{accent-color:var(--primary)}
.re-user{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.re-user-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.re-name{flex:1;font-weight:700;font-size:.85em;min-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.re-chk{display:flex;align-items:center;gap:5px;font-size:.75em;font-weight:600;color:var(--text-muted);cursor:pointer}
.re-chk input{accent-color:var(--primary)}
.re-perms{display:none;flex-wrap:wrap;gap:10px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--border)}
.re-perms.on{display:flex}
.re-foot{display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--border)}
.re-foot button{flex:1;padding:11px;border-radius:10px;border:none;font-family:inherit;font-weight:700;font-size:.88em;cursor:pointer}
.re-foot .cancel{background:var(--bg-input);color:var(--text-muted)}
.re-foot .ok{background:var(--primary);color:#fff}

/* Toast & Modal */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:.7em 1.5em;border-radius:2em;font-weight:600;font-size:.85em;opacity:0;transition:all .4s ease;z-index:9999;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow);max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.custom-modal{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.custom-modal.active{display:flex}
.custom-modal .modal-box{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:24px;box-shadow:var(--shadow);border:1px solid var(--border)}
.modal-title{font-size:1.2em;font-weight:700;margin-bottom:8px}
.modal-body{font-size:.95em;color:var(--text-muted);margin-bottom:16px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.modal-actions button{padding:6px 18px;border-radius:10px;border:none;font-weight:600;cursor:pointer;font-family:inherit}
.modal-actions .btn-danger{background:#e57373;color:#fff}
.modal-actions .btn-secondary{background:var(--bg-input);color:var(--text-muted)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
</style>
</head>
<body>

<!-- ============ 视图1：房间列表 ============ -->
<div class="view-list" id="listView">
  <div class="page-header">
    <button class="back" onclick="window.location.href='/liuyanban/chats.html'">
      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>

      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>

      <div class="game-stage" id="gameStage">

          <div class="gpm-players" id="gpmPlayers"></div>
          <button class="fs-btn" id="fsBtn" type="button" title="全屏">
            <svg viewBox="0 0 24 24" id="fsIcon"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>

      游戏
    </button>
    <input type="text" id="roomInput" placeholder="说点什么…" maxlength="200" />
    <button class="send-btn" id="roomSendBtn">发送</button>
  </div>
</div>

<!-- ============ 游戏抽屉 ============ -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<div class="game-drawer" id="gameDrawer">
  <div class="drawer-handle"></div>
  <div class="drawer-title">🎮 选择游戏</div>
  <div class="game-grid" id="gameGrid"></div>
</div>

<!-- ============ 确认弹窗 ============ -->
<div class="custom-modal" id="confirmModal">
  <div class="modal-box">
    <div class="modal-title" id="confirmTitle">确认</div>
    <div class="modal-body" id="confirmBody">确定要执行此操作吗？</div>
    <div class="modal-actions">
      <button class="btn-secondary" id="confirmCancel">取消</button>
      <button class="btn-danger" id="confirmOk">确定</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/liuyanban/common.js"></script>
<script>
/* ============================================================
   基础工具
============================================================ */
var SUPABASE_URL="https://ulvhuqtpdafspbdvkogs.supabase.co";
var SUPABASE_ANON_KEY="sb_publishable_Ew8kKf2z05kmYIK2XNu00g_dzAirtIM";
window.sb=window.sb||window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

function showToast(m){var t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(function(){t.classList.remove('show')},2600)}
function escapeHtml(s){if(!s)return '';return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function showConfirm(title,body,onOk){var m=document.getElementById('confirmModal');document.getElementById('confirmTitle').textContent=title;document.getElementById('confirmBody').textContent=body;m.classList.add('active');var c=document.getElementById('confirmCancel'),o=document.getElementById('confirmOk');var cleanup=function(){m.classList.remove('active');c.onclick=null;o.onclick=null};c.onclick=cleanup;o.onclick=function(){if(onOk)onOk();cleanup()}}

var currentUser=getSessionUser();
if(!currentUser||!currentUser.id)window.location.href='/liuyanban/index.html';
var isAdmin=!!(currentUser&&currentUser.phone==='17355394710');
if(isAdmin)document.getElementById('createRoomBtn').classList.add('show');

function isUserBanned(){if(!currentUser||!currentUser.banned_until)return false;return new Date(currentUser.banned_until)>new Date()}

/* ============================================================
   全局状态
============================================================ */
var rooms=[];
var state={room:null,messages:[],roomChannel:null,msgChannel:null};

/* ============================================================
   视图切换
============================================================ */
function showList(){document.getElementById('listView').classList.remove('hidden');document.getElementById('detailView').classList.remove('open')}
function showDetail(){document.getElementById('listView').classList.add('hidden');document.getElementById('detailView').classList.add('open')}

document.getElementById('detailBackBtn').onclick=function(){
  // ★ 关键：离开房间时自动退出游戏
  if(state.room&&state.room.current_game){
    try{leaveGame()}catch(e){}
  }
  leaveRoomLocal();
  history.replaceState({},'',location.pathname);
  showList();
  loadRooms();
};

/* ============================================================
   房间列表
============================================================ */
async function loadRooms(){
  var grid=document.getElementById('roomGrid');
  grid.innerHTML='<div class="loading-state"><div class="spinner"></div>加载中…</div>';
  try{
    var res=await window.sb.from('rooms').select('*').order('created_at',{ascending:true});
    if(res.error)throw res.error;
    rooms=res.data||[];
    renderGrid();
  }catch(e){
    grid.innerHTML='<div class="empty-state"><div class="big">🏠</div>房间功能尚未初始化'+(isAdmin?'<br><small style="color:var(--text-light);">请先在 Supabase 创建 rooms 数据表</small>':'')+'</div>';
  }
}
function renderGrid(){
  var grid=document.getElementById('roomGrid');
  if(!rooms.length){grid.innerHTML='<div class="empty-state"><div class="big">🏠</div>还没有房间'+(isAdmin?'<br><small>点击右上角创建第一个房间</small>':'')+'</div>';return}
  grid.innerHTML=rooms.map(function(r){
    var coIds=r.co_admin_ids||[];
    var isCo=coIds.indexOf(currentUser.id)>=0;
    var badge=(isAdmin||isCo)?'<span class="room-card-badge">管理</span>':'';
    var editBtn=isAdmin?'<button class="room-edit-btn" data-edit="'+r.id+'" title="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>':'';
    var gameTag=r.current_game&&r.current_game.type?'<div class="room-card-meta" style="color:var(--primary);font-weight:700;">🎮 游戏中</div>':'<div class="room-card-meta">'+(r.mic_mode==='host'?'主持人连麦':'自由连麦')+'</div>';
    return '<div class="room-card" data-id="'+r.id+'">'+badge+editBtn+
      '<div class="room-card-icon"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg></div>'+
      '<div class="room-card-name">'+escapeHtml(r.name)+'</div>'+gameTag+
    '</div>';
  }).join('');
  grid.querySelectorAll('.room-card').forEach(function(el){
    el.addEventListener('click',function(e){
      if(e.target.closest('.room-edit-btn'))return;
      enterRoom(this.dataset.id);
    });
  });
  grid.querySelectorAll('.room-edit-btn').forEach(function(b){
    b.addEventListener('click',function(e){
      e.stopPropagation();
      enterRoom(this.dataset.edit,true);
    });
  });
}

document.getElementById('createRoomBtn').onclick=async function(){
  if(!isAdmin)return;
  var name=prompt('请输入房间名称：');
  if(name===null)return;
  name=name.trim();
  if(!name){showToast('名称不能为空');return}
  try{
    var res=await window.sb.from('rooms').insert([{
      name:name,creator_id:currentUser.id,
      co_admin_ids:[],co_admin_permissions:{},muted_user_ids:[],
      mic_enabled:true,mic_mode:'free',mic_speaking:[],mic_requests:[]
    }]).select().single();
    if(res.error)throw res.error;
    showToast('✅ 房间已创建');
    await loadRooms();
  }catch(e){showToast('创建失败：'+e.message)}
};

/* ============================================================
   进入 / 离开房间
============================================================ */
async function enterRoom(roomId,openSettings){
  try{
    var res=await window.sb.from('rooms').select('*').eq('id',roomId).single();
    if(res.error)throw res.error;
    state.room=res.data;
    state.messages=[];
    document.getElementById('roomTitle').textContent=state.room.name;
    history.replaceState({},'','?id='+roomId);
    showDetail();
    updateSettingsBtn();
    renderMic();
    renderGame();
    await loadMessages();
    subscribe();
    if(openSettings&&isAdmin)setTimeout(openRoomEditor,300);
  }catch(e){showToast('进入房间失败：'+e.message)}
}

function leaveRoomLocal(){
  if(state.room&&currentUser){
    try{
      var sp=(state.room.mic_speaking||[]).filter(function(m){return m.user_id!==currentUser.id});
      var rq=(state.room.mic_requests||[]).filter(function(m){return m.user_id!==currentUser.id});
      window.sb.from('rooms').update({mic_speaking:sp,mic_requests:rq}).eq('id',state.room.id);
    }catch(e){}
  }
  if(state.roomChannel){window.sb.removeChannel(state.roomChannel);state.roomChannel=null}
  if(state.msgChannel){window.sb.removeChannel(state.msgChannel);state.msgChannel=null}
  state.room=null;state.messages=[];
}

function updateSettingsBtn(){var b=document.getElementById('roomSettingsBtn');if(b)b.classList.toggle('show',isAdmin)}

async function freshRoom(){var r=await window.sb.from('rooms').select('*').eq('id',state.room.id).single();if(r.error)throw r.error;return r.data}
async function patchRoom(patch){var res=await window.sb.from('rooms').update(patch).eq('id',state.room.id).select().single();if(res.error)throw res.error;state.room=res.data;document.getElementById('roomTitle').textContent=state.room.name;renderMic();renderGame();return state.room}

/* ============================================================
   麦位
============================================================ */
function renderMic(){
  var el=document.getElementById('micArea');
  var r=state.room;if(!r){el.innerHTML='';return}
  // ★ 游戏模式：隐藏麦位（由 renderGame 处理）
  if(r.current_game){el.innerHTML='';return}
  var speaking=r.mic_speaking||[],requests=r.mic_requests||[];
  var iAmOn=speaking.some(function(m){return m.user_id===currentUser.id});
  var iAmWaiting=requests.some(function(m){return m.user_id===currentUser.id});
  var coIds=r.co_admin_ids||[],permsMap=r.co_admin_permissions||{};
  var myPerms=permsMap[currentUser.id]||{};
  var canManage=isAdmin||(coIds.indexOf(currentUser.id)>=0&&myPerms.mic!==false);

  var h='<div class="mic-panel">';
  h+='<div class="mic-head"><span class="mic-title">🎙 麦位 '+speaking.length+'/4</span><span class="mic-mode">'+(r.mic_mode==='host'?'主持人连麦':'自由连麦')+'</span></div>';
  if(r.mic_enabled===false){
    h+='<div class="mic-off">本房间连麦已被管理员关闭</div>';
  }else{
    h+='<div class="mic-seats">';
    for(var i=0;i<4;i++){
      var m=speaking[i];
      h+='<div class="mic-seat'+(m?' on':'')+'">';
      if(m){
        var has=m.avatar_url&&String(m.avatar_url).indexOf('http')===0;
        h+='<div class="mic-avatar" style="'+(has?'background-image:url('+escapeHtml(m.avatar_url)+');background-size:cover;background-position:center;':'')+'">'+(has?'':escapeHtml(String(m.nickname||'U').charAt(0).toUpperCase()))+'</div>';
        h+='<div class="mic-name">'+escapeHtml(m.nickname||'')+'</div>';
        if(canManage||m.user_id===currentUser.id)h+='<button class="mic-x" onclick="removeFromMic(\''+m.user_id+'\')" title="下麦">✕</button>';
      }else{
        h+='<div class="mic-avatar empty">+</div><div class="mic-name">空位</div>';
      }
      h+='</div>';
    }
    h+='</div>';
    h+='<div class="mic-actions">';
    if(iAmOn)h+='<button class="mic-btn leave" onclick="removeFromMic(\''+currentUser.id+'\')">下麦</button>';
    else if(iAmWaiting)h+='<button class="mic-btn waiting" onclick="cancelMic()">排队中 · 点击取消</button>';
    else h+='<button class="mic-btn join" onclick="requestMic()">'+(r.mic_mode==='host'?'申请连麦':'排队上麦')+'</button>';
    h+='</div>';
    if(requests.length){
      h+='<div class="mic-queue"><div class="mic-queue-title">排队中（'+requests.length+'）</div>';
      requests.forEach(function(q){
        h+='<div class="mic-queue-item"><span>'+escapeHtml(q.nickname||'')+'</span>';
        if(canManage){h+='<button onclick="approveMic(\''+q.user_id+'\')">同意</button><button onclick="rejectMic(\''+q.user_id+'\')">拒绝</button>'}
        h+='</div>';
      });
      h+='</div>';
    }
  }
  h+='</div>';
  el.innerHTML=h;
}

async function requestMic(){if(isUserBanned()){showToast('账号已被封禁');return}try{var r=await freshRoom();var speaking=r.mic_speaking||[],requests=r.mic_requests||[];if(requests.some(function(x){return x.user_id===currentUser.id}))return;if(speaking.some(function(x){return x.user_id===currentUser.id}))return;var me={user_id:currentUser.id,nickname:currentUser.nickname,avatar_url:currentUser.avatar_url||''};if(r.mic_mode!=='host'&&speaking.length<4){speaking.push(me);await patchRoom({mic_speaking:speaking});showToast('🎙 已上麦')}else{requests.push(me);await patchRoom({mic_requests:requests});showToast(r.mic_mode==='host'?'已申请，等待管理员同意':'已加入排队')}}catch(e){showToast('操作失败：'+e.message)}}
async function cancelMic(){try{var r=await freshRoom();var requests=(r.mic_requests||[]).filter(function(x){return x.user_id!==currentUser.id});await patchRoom({mic_requests:requests});showToast('已取消排队')}catch(e){showToast(e.message)}}
async function removeFromMic(userId){try{var r=await freshRoom();var speaking=(r.mic_speaking||[]).filter(function(m){return m.user_id!==userId});var requests=r.mic_requests||[];if(r.mic_mode!=='host'&&requests.length&&speaking.length<4)speaking.push(requests.shift());await patchRoom({mic_speaking:speaking,mic_requests:requests});if(userId===currentUser.id)showToast('已下麦')}catch(e){showToast(e.message)}}
async function approveMic(userId){try{var r=await freshRoom();var requests=r.mic_requests||[];var idx=-1;for(var i=0;i<requests.length;i++){if(requests[i].user_id===userId){idx=i;break}}if(idx<0)return;var m=requests.splice(idx,1)[0];var speaking=r.mic_speaking||[];if(speaking.length>=4){showToast('麦位已满');return}speaking.push(m);await patchRoom({mic_speaking:speaking,mic_requests:requests});showToast('已同意连麦')}catch(e){showToast(e.message)}}
async function rejectMic(userId){try{var r=await freshRoom();var requests=(r.mic_requests||[]).filter(function(x){return x.user_id!==userId});await patchRoom({mic_requests:requests});showToast('已拒绝')}catch(e){showToast(e.message)}}
window.requestMic=requestMic;window.cancelMic=cancelMic;
window.removeFromMic=removeFromMic;window.approveMic=approveMic;window.rejectMic=rejectMic;

/* ============================================================
   ★★★ 游戏系统 ★★★
============================================================ */
var GAMES=[
  {id:'gomoku',name:'五子棋',desc:'2人对弈',max:2,icon:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><circle cx="9" cy="9" r="1.4" fill="currentColor"/><circle cx="15" cy="15" r="1.4" fill="currentColor"/></svg>'},
  {id:'draw',name:'你画我猜',desc:'脑洞大比拼',max:8,icon:'<svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>'},
  {id:'spy',name:'谁是卧底',desc:'推理社交',max:8,icon:'<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'},

async function selectGame(gameId){

async function startGame(gameId){
  var g=GAMES.find(function(x){return x.id===gameId});
  if(!g)return;
  var newGame={
    type:gameId,
    started_at:new Date().toISOString(),
    players:[{user_id:currentUser.id,nickname:currentUser.nickname,avatar_url:currentUser.avatar_url||'',seat:0}],
    state:initGameState(gameId)
  };
  try{
    await updateGame(newGame);
    showToast('🎮 已开始「'+g.name+'」');
  }catch(e){showToast('启动失败：'+e.message)}
}

function initGameState(type){
  if(type==='gomoku')return{board:emptyBoard(),turn:'black',winner:null,status:'playing'};
  if(type==='draw')return{round:1,drawer_id:currentUser.id,word:pickWord(),strokes:[],correct:[],messages:[]};
  if(type==='spy')return{phase:'describe',words:{},descriptions:[],votes:{},eliminated:[]};
  if(type==='werewolf')return{phase:'night',roles:{},alive:[],night_action:null};
  return{};
}
function pickWord(){return WORDS_DRAW[Math.floor(Math.random()*WORDS_DRAW.length)]}
function emptyBoard(){var b=[];for(var i=0;i<15;i++){var r=[];for(var j=0;j<15;j++)r.push(null);b.push(r)}return b}

async function leaveGame(){
  if(!state.room||!state.room.current_game)return;
  var game=state.room.current_game;
  var players=(game.players||[]).filter(function(p){return p.user_id!==currentUser.id});
  if(!players.length){
    // 没人了，删除游戏
    await updateGame(null);
  }else{
    // 更新玩家列表；若是五子棋，重置回合
    var ns=Object.assign({},game,{players:players});
    if(game.type==='gomoku'){
      ns.state=Object.assign({},game.state,{board:emptyBoard(),turn:'black',winner:null,status:'playing'});
    }
    if(game.type==='draw'&&game.state.drawer_id===currentUser.id&&players.length){
      ns.state=Object.assign({},game.state,{drawer_id:players[0].user_id,word:pickWord(),strokes:[],correct:[]});
    }
    await updateGame(ns);
  }
}

function renderGomoku(game,el){
  var st=game.state||{},board=st.board||emptyBoard();
  var players=game.players||[];
  var statusText='';
  if(st.status==='waiting')statusText='等待玩家加入…';

  else{
    var myColor=players[0]&&players[0].user_id===currentUser.id?'black':(players[1]&&players[1].user_id===currentUser.id?'white':null);
    if(myColor)statusText=st.turn===myColor?'🔵 轮到你落子':'⏳ 等待对方…';
    else statusText=(st.turn==='black'?'黑方':'白方')+' 思考中…';
  }
  var html='<div class="gomoku-wrap"><div class="gomoku-status">'+statusText+'</div><div class="gomoku-board" id="gmkBoard">';
  for(var rr=0;rr<15;rr++)for(var cc=0;cc<15;cc++){
    var v=(board[rr]&&board[rr][cc])||null;
    var cls=v==='b'?'black':(v==='w'?'white':'');
    html+='<div class="gmk-cell" data-r="'+rr+'" data-c="'+cc+'">'+(v?'<span class="gmk-stone '+cls+'"></span>':'')+'</div>';
  }
  html+='</div></div>';
  el.innerHTML=html;
  el.querySelectorAll('.gmk-cell').forEach(function(cell){
    cell.onclick=function(){placeStoneGmk(parseInt(this.dataset.r,10),parseInt(this.dataset.c,10))};
  });
}

async function placeStoneGmk(r,c){
  var game=state.room&&state.room.current_game;
  if(!game||game.type!=='gomoku')return;
  var st=game.state,players=game.players||[];
  if(st.status!=='playing'){showToast('对局尚未开始');return}
  var myColor=players[0]&&players[0].user_id===currentUser.id?'black':(players[1]&&players[1].user_id===currentUser.id?'white':null);
  if(!myColor){showToast('你不是本局玩家');return}
  if(st.turn!==myColor){showToast('还没轮到你');return}
  if(st.board[r][c])return;
  var board=st.board.map(function(row){return row.slice()});
  var stone=myColor==='black'?'b':'w';
  board[r][c]=stone;
  var won=checkWinGmk(board,r,c,stone);
  var ns={board:board,turn:myColor==='black'?'white':'black',status:won?'finished':'playing',winner:won?myColor:null};
  try{
    await updateGame(Object.assign({},game,{state:ns}));
  }catch(e){showToast('落子失败：'+e.message)}
}
function checkWinGmk(board,r,c,color){
  var dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(var d=0;d<dirs.length;d++){
    var dr=dirs[d][0],dc=dirs[d][1],cnt=1;
    for(var s=-1;s<=1;s+=2){
      var rr=r+dr*s,cc=c+dc*s;
      while(rr>=0&&rr<15&&cc>=0&&cc<15&&board[rr][cc]===color){cnt++;rr+=dr*s;cc+=dc*s}
    }
    if(cnt>=5)return true;
  }
  return false;
}

var drawState={color:'#000000',size:5,drawing:false,currentStroke:null,canvas:null,ctx:null,isDrawer:false};
function setDrawColor(el){drawState.color=el.dataset.color;document.querySelectorAll('.draw-color').forEach(function(x){x.classList.remove('active')});el.classList.add('active')}
function setDrawSize(el){drawState.size=parseInt(el.dataset.size,10);document.querySelectorAll('.draw-size').forEach(function(x){x.classList.remove('active')});el.classList.add('active')}
window.setDrawColor=setDrawColor;window.setDrawSize=setDrawSize;

function initDrawCanvas(game,isDrawer){
  var canvas=document.getElementById('drawCanvas');
  if(!canvas)return;
  var wrap=canvas.parentElement;
  var w=wrap.clientWidth,h=Math.max(180,Math.min(w,300));
  canvas.width=w;canvas.height=h;
  canvas.style.height=h+'px';
  drawState.canvas=canvas;drawState.ctx=canvas.getContext('2d');drawState.isDrawer=isDrawer;
  redrawStrokes(game.state.strokes||[]);

  if(!isDrawer)return;
  canvas.addEventListener('mousedown',startDraw);
  canvas.addEventListener('mousemove',moveDraw);
  canvas.addEventListener('mouseup',endDraw);
  canvas.addEventListener('mouseleave',endDraw);
  canvas.addEventListener('touchstart',function(e){e.preventDefault();startDraw(e.touches[0])},{passive:false});
  canvas.addEventListener('touchmove',function(e){e.preventDefault();moveDraw(e.touches[0])},{passive:false});
  canvas.addEventListener('touchend',function(e){e.preventDefault();endDraw()},{passive:false});
}

function getPos(canvas,e){
  var r=canvas.getBoundingClientRect();
  return{x:(e.clientX-r.left)*(canvas.width/r.width),y:(e.clientY-r.top)*(canvas.height/r.height)};
}
function startDraw(e){
  if(!drawState.isDrawer)return;
  drawState.drawing=true;
  drawState.currentStroke={color:drawState.color,size:drawState.size,points:[getPos(drawState.canvas,e)]};
}
function moveDraw(e){
  if(!drawState.drawing)return;
  var p=getPos(drawState.canvas,e);
  var s=drawState.currentStroke;
  var last=s.points[s.points.length-1];
  s.points.push(p);
  var ctx=drawState.ctx;
  ctx.strokeStyle=s.color;ctx.lineWidth=s.size;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();
  clearTimeout(drawState._syncTimer);
  drawState._syncTimer=setTimeout(syncStrokes,120);
}
function endDraw(){
  if(!drawState.drawing)return;
  drawState.drawing=false;
  if(drawState.currentStroke&&drawState.currentStroke.points.length<2){
    drawState.currentStroke.points.push(drawState.currentStroke.points[0]);
  }
  syncStrokes();
}
async function syncStrokes(){
  if(!state.room||!state.room.current_game)return;
  var game=state.room.current_game;
  var strokes=(game.state.strokes||[]).slice();
  if(drawState.currentStroke&&!strokes.find(function(s){return s===drawState.currentStroke})){
    strokes.push(drawState.currentStroke);
  }
  try{
    await updateGame(Object.assign({},game,{state:Object.assign({},game.state,{strokes:strokes})}));
  }catch(e){}
}
function redrawStrokes(strokes){
  var ctx=drawState.ctx;if(!ctx)return;
  ctx.clearRect(0,0,drawState.canvas.width,drawState.canvas.height);
  strokes.forEach(function(s){
    ctx.strokeStyle=s.color;ctx.lineWidth=s.size;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();
    s.points.forEach(function(p,i){if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)});
    ctx.stroke();
  });
}
async function clearDraw(){
  if(!state.room||!state.room.current_game)return;
  var game=state.room.current_game;
  if(game.state.drawer_id!==currentUser.id)return;
  await updateGame(Object.assign({},game,{state:Object.assign({},game.state,{strokes:[]})}));
}
window.clearDraw=clearDraw;

async function submitDrawGuess(){
  if(!state.room||!state.room.current_game)return;
  var game=state.room.current_game;
  if(game.type!=='draw')return;
  if(game.state.drawer_id===currentUser.id){showToast('你是画手');return}
  var input=document.getElementById('drawGuessInput');
  var guess=(input.value||'').trim();
  if(!guess)return;
  input.value='';
  var isCorrect=guess===game.state.word;
  var msgs=(game.state.messages||[]).slice();
  msgs.push({text:currentUser.nickname+'：'+guess,correct:isCorrect});
  if(msgs.length>50)msgs=msgs.slice(-50);
  var ns=Object.assign({},game.state,{messages:msgs});
  if(isCorrect){
    var corr=(ns.correct||[]).slice();
    if(corr.indexOf(currentUser.id)<0)corr.push(currentUser.id);
    ns.correct=corr;
    ns.messages.push({text:'✅ '+currentUser.nickname+' 猜对了！答案：'+game.state.word,correct:true});
  }
  await updateGame(Object.assign({},game,{state:ns}));
}
window.submitDrawGuess=submitDrawGuess;

/* ============ 谁是卧底 ============ */
function renderSpy(game,el){
  var st=game.state||{},players=game.players||[];
  // 懒加载角色分配
  if(!st.words||!Object.keys(st.words).length){
    var pair=WORDS_SPY[Math.floor(Math.random()*WORDS_SPY.length)];
    var spyIdx=Math.floor(Math.random()*players.length);
    var words={};
    players.forEach(function(p,i){words[p.user_id]=i===spyIdx?pair[1]:pair[0]});
    var ns=Object.assign({},st,{words:words,spy_id:players[spyIdx].user_id,phase:'describe',descriptions:[],votes:{},eliminated:[]});
    updateGame(Object.assign({},game,{state:ns}));
    return;
  }
  var myWord=st.words[currentUser.id]||'?';
  var eliminated=st.eliminated||[];
  var descriptions=st.descriptions||[];

  var html='<div class="spy-wrap">';
  html+='<div class="spy-role-card"><div class="spy-role-label">你的词语</div><div class="spy-role-word">'+escapeHtml(myWord)+'</div><div class="spy-desc">用一句话描述，不能直接说出词！</div></div>';

  // 描述阶段
  html+='<div style="font-size:.78em;font-weight:700;">描述阶段</div>';
  html+='<div class="spy-players">';
  players.forEach(function(p){
    var isElim=eliminated.indexOf(p.user_id)>=0;
    var desc=descriptions.find(function(d){return d.user_id===p.user_id});
    var has=p.avatar_url&&String(p.avatar_url).indexOf('http')===0;
    html+='<div class="spy-player'+(isElim?' eliminated':'')+'">'+
      '<div class="gpm-avatar" style="'+(has?'background-image:url('+escapeHtml(p.avatar_url)+');background-size:cover;background-position:center;':'')+'">'+(has?'':escapeHtml(String(p.nickname).charAt(0).toUpperCase()))+'</div>'+
      '<div class="name">'+escapeHtml(p.nickname)+'</div>'+
      (desc?'<div style="font-size:.72em;opacity:.8;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(desc.text)+'</div>':'')+
      (!desc&&!isElim&&p.user_id!==currentUser.id?'<span style="font-size:.7em;opacity:.5;">等待…</span>':'')+
    '</div>';
  });
  html+='</div>';

  var myDesc=descriptions.find(function(d){return d.user_id===currentUser.id});
  if(!myDesc&&eliminated.indexOf(currentUser.id)<0){
    html+='<div class="spy-desc-input"><input id="spyDescInput" maxlength="30" placeholder="输入你的描述…" onkeydown="if(event.key===\'Enter\')submitSpyDesc()" /><button onclick="submitSpyDesc()">发送</button></div>';
  }else{
    // 所有人都描述完了 → 进入投票
    var allDescribed=players.filter(function(p){return eliminated.indexOf(p.user_id)<0}).every(function(p){return descriptions.find(function(d){return d.user_id===p.user_id})});
    if(allDescribed){
      html+='<div style="text-align:center;margin-top:8px;"><button class="spy-desc-input button" style="padding:10px 24px;background:#8b5cf6;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;" onclick="startSpyVote()">进入投票</button></div>';
    }
  }

  // 投票结果展示
  if(st.lastVote){
    var lv=st.lastVote;
    var votedPlayer=players.find(function(p){return p.user_id===lv.out_id});
    html+='<div class="spy-timeline"><div class="spy-line">🗳 '+escapeHtml(votedPlayer?votedPlayer.nickname:'?')+' 被淘汰</div><div class="spy-line">身份：'+(lv.out_id===st.spy_id?'🎭 卧底':'👥 平民')+'</div>'+(lv.win?'<div class="spy-line" style="color:#c8a5ff;font-weight:700;">🎉 '+escapeHtml(lv.win)+' 获胜！</div>':'<div class="spy-line">游戏继续…</div>')+'</div>';
  }

  // 投票阶段
  if(st.phase==='vote'&&!st.lastVote){
    html+='<div style="font-size:.78em;font-weight:700;margin-top:8px;">投票淘汰</div>';
    html+='<div class="spy-players">';
    players.forEach(function(p){
      if(eliminated.indexOf(p.user_id)>=0||p.user_id===currentUser.id)return;
      var has=p.avatar_url&&String(p.avatar_url).indexOf('http')===0;
      html+='<div class="spy-player">'+
        '<div class="gpm-avatar" style="'+(has?'background-image:url('+escapeHtml(p.avatar_url)+');background-size:cover;background-position:center;':'')+'">'+(has?'':escapeHtml(String(p.nickname).charAt(0).toUpperCase()))+'</div>'+
        '<div class="name">'+escapeHtml(p.nickname)+'</div>'+
        '<button class="vote-btn" onclick="castSpyVote(\''+p.user_id+'\')">投票</button>'+
      '</div>';
    });
    html+='</div>';
  }

  html+='</div>';
  el.innerHTML=html;
}

async function submitSpyDesc(){
  if(!state.room||!state.room.current_game)return;
  var game=state.room.current_game;
  var input=document.getElementById('spyDescInput');
  var text=(input.value||'').trim();
  if(!text)return;
  var descs=(game.state.descriptions||[]).slice();
  descs.push({user_id:currentUser.id,nickname:currentUser.nickname,text:text});
  await updateGame(Object.assign({},game,{state:Object.assign({},game.state,{descriptions:descs})}));
}
window.submitSpyDesc=submitSpyDesc;

async function startSpyVote(){
  if(!state.room||!state.room.current_game)return;
  var game=state.room.current_game;
  await updateGame(Object.assign({},game,{state:Object.assign({},game.state,{phase:'vote'})}));
}
window.startSpyVote=startSpyVote;

async function castSpyVote(targetId){
  if(!state.room||!state.room.current_game)return;
  var game=state.room.current_game;
  var votes=Object.assign({},game.state.votes||{});
  votes[currentUser.id]=targetId;
  var players=game.players||[];
  var alivePlayers=players.filter(function(p){return (game.state.eliminated||[]).indexOf(p.user_id)<0});
  var allVoted=alivePlayers.every(function(p){return votes[p.user_id]});
  var ns=Object.assign({},game.state,{votes:votes});
  if(allVoted){
    // 统计票数
    var tally={};
    Object.values(votes).forEach(function(t){tally[t]=(tally[t]||0)+1});
    var maxId=null,maxV=0;
    Object.keys(tally).forEach(function(id){if(tally[id]>maxV){maxV=tally[id];maxId=id}});
    var elim=(ns.eliminated||[]).slice();
    elim.push(maxId);
    ns.eliminated=elim;
    ns.lastVote={out_id:maxId};
    if(maxId===ns.spy_id){ns.lastVote.win='平民'}
    else if(elim.filter(function(id){return id!==ns.spy_id}).length>=(players.length-1)/2){ns.lastVote.win='卧底'}
    ns.phase='describe';
    ns.descriptions=[];
    ns.votes={};
  }
  await updateGame(Object.assign({},game,{state:ns}));
}
window.castSpyVote=castSpyVote;

/* ============ 狼人杀（基础版） ============ */
function renderWerewolf(game,el){
  var st=game.state||{},players=game.players||[];
  if(!st.roles||!Object.keys(st.roles).length){
    if(players.length<4){el.innerHTML='<div class="ww-wrap"><div style="text-align:center;padding:20px;font-size:.9em;">需要至少 4 名玩家才能开始（当前 '+players.length+' 人）</div></div>';return}
    var roles={};
    var shuffled=players.slice().sort(function(){return Math.random()-.5});
    shuffled.forEach(function(p,i){
      if(i===0)roles[p.user_id]='狼人';
      else if(i===1)roles[p.user_id]='预言家';
      else if(i===2)roles[p.user_id]='女巫';
      else roles[p.user_id]='平民';
    });
    var ns=Object.assign({},st,{roles:roles,phase:'night',alive:players.map(function(p){return p.user_id}),night_action:null,votes:{},day:1});
    updateGame(Object.assign({},game,{state:ns}));
    return;
  }
  var myRole=st.roles[currentUser.id]||'?';
  var alive=st.alive||[];
  var html='<div class="ww-wrap">';
  html+='<div class="ww-role-card"><div class="ww-role-label">你的身份</div><div class="ww-role-word">'+escapeHtml(myRole)+'</div><div class="ww-desc">第 '+st.day+' 天 · '+(st.phase==='night'?'🌙 夜晚':'☀️ 白天')+'</div></div>';

  html+='<div class="ww-players">';
  players.forEach(function(p){
    var dead=alive.indexOf(p.user_id)<0;
    var has=p.avatar_url&&String(p.avatar_url).indexOf('http')===0;
    var actionBtn='';
    if(st.phase==='night'&&myRole==='狼人'&&!dead&&p.user_id!==currentUser.id){
      actionBtn='<button class="btn" onclick="nightKill(\''+p.user_id+'\')">击杀</button>';
    }
    if(st.phase==='day'&&!dead&&p.user_id!==currentUser.id){
      actionBtn='<button class="btn" onclick="dayVote(\''+p.user_id+'\')">投票</button>';
    }
    html+='<div class="ww-player'+(dead?' dead':'')+'">'+
      '<div class="gpm-avatar" style="'+(has?'background-image:url('+escapeHtml(p.avatar_url)+');background-size:cover;background-position:center;':'')+'">'+(has?'':escapeHtml(String(p.nickname).charAt(0).toUpperCase()))+'</div>'+
      '<div class="name">'+escapeHtml(p.nickname)+'</div>'+actionBtn+
    '</div>';
  });
  html+='</div>';
  html+='</div>';
  el.innerHTML=html;
}
async function nightKill(targetId){
  if(!state.room||!state.room.current_game)return;
  var game=state.room.current_game;
  await updateGame(Object.assign({},game,{state:Object.assign({},game.state,{night_action:targetId})}));
}
window.nightKill=nightKill;
async function dayVote(targetId){
  if(!state.room||!state.room.current_game)return;
  var game=state.room.current_game;
  var votes=Object.assign({},game.state.votes||{});
  votes[currentUser.id]=targetId;
  await updateGame(Object.assign({},game,{state:Object.assign({},game.state,{votes:votes})}));
}
window.dayVote=dayVote;

/* ============================================================
   房间消息
============================================================ */
async function loadMessages(){
  try{
    var res=await window.sb.from('room_messages').select('*').eq('room_id',state.room.id).order('created_at',{ascending:true}).limit(200);
    if(res.error)throw res.error;
    state.messages=res.data||[];
  }catch(e){state.messages=[]}
  renderMessages();
}
function renderMessages(){
  var c=document.getElementById('roomMessages');
  if(!state.messages.length){c.innerHTML='<div class="empty-state" style="padding:20px;font-size:.85em;color:var(--text-muted)">还没有人说话，来打个招呼吧</div>';return}
  c.innerHTML=state.messages.map(function(m){
    var self=m.user_id===currentUser.id;
    var has=m.avatar_url&&String(m.avatar_url).indexOf('http')===0;
    return '<div class="rm-msg'+(self?' self':'')+'">'+
      '<div class="rm-avatar" style="'+(has?'background-image:url('+escapeHtml(m.avatar_url)+');background-size:cover;background-position:center;':'')+'">'+(has?'':escapeHtml(String(m.author||'U').charAt(0).toUpperCase()))+'</div>'+
      '<div class="rm-bubble"><div class="rm-name">'+escapeHtml(m.author||'')+'</div><div class="rm-text">'+escapeHtml(m.content||'')+'</div></div>'+
    '</div>';
  }).join('');
  c.scrollTop=c.scrollHeight;
}
async function sendMsg(){
  if(!state.room)return;
  if(isUserBanned()){showToast('账号已被封禁，无法发送消息');return}
  var r=state.room,muted=r.muted_user_ids||[];
  if(!isAdmin&&muted.indexOf(currentUser.id)>=0){showToast('你已被禁言，无法在本房间发言');return}
  var input=document.getElementById('roomInput'),text=input.value.trim();
  if(!text){showToast('请输入内容');return}
  input.value='';
  try{
    var res=await window.sb.from('room_messages').insert([{room_id:state.room.id,user_id:currentUser.id,author:currentUser.nickname,avatar_url:currentUser.avatar_url||'',content:text}]);
    if(res.error)throw res.error;
  }catch(e){showToast('发送失败：'+e.message);input.value=text}
}

/* ============================================================
   实时订阅
============================================================ */
function subscribe(){
  if(state.roomChannel){window.sb.removeChannel(state.roomChannel);state.roomChannel=null}
  if(state.msgChannel){window.sb.removeChannel(state.msgChannel);state.msgChannel=null}
  var roomId=state.room.id;
  state.roomChannel=window.sb.channel('sq-room-'+roomId+'-'+Date.now())
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'rooms',filter:'id=eq.'+roomId},function(p){
      state.room=p.new;
      document.getElementById('roomTitle').textContent=state.room.name;
      renderMic();
      renderGame();
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'rooms',filter:'id=eq.'+roomId},function(){
      showToast('房间已被删除');leaveRoomLocal();history.replaceState({},'',location.pathname);showList();loadRooms();
    })
    .subscribe();
  state.msgChannel=window.sb.channel('sq-room-msg-'+roomId+'-'+Date.now())
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'room_messages',filter:'room_id=eq.'+roomId},function(p){
      if(state.messages.some(function(x){return x.id===p.new.id}))return;
      state.messages.push(p.new);renderMessages();
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'room_messages',filter:'room_id=eq.'+roomId},function(){loadMessages()})
    .subscribe();
}

/* ============================================================
   房间设置（管理员）
============================================================ */
async function fetchAllUsers(){var r=await window.sb.from('users').select('id, nickname, avatar_url, phone');return r.data||[]}

async function openRoomEditor(){
  if(!isAdmin||!state.room)return;
  var room=await freshRoom();
  var users=await fetchAllUsers();
  var coIds=room.co_admin_ids||[],permsMap=room.co_admin_permissions||{},mutedIds=room.muted_user_ids||[];
  var old=document.getElementById('roomEditorOverlay');if(old)old.remove();
  var overlay=document.createElement('div');overlay.className='re-overlay';overlay.id='roomEditorOverlay';
  var userRows=users.filter(function(u){return u.id!==currentUser.id}).map(function(u){
    var isCo=coIds.indexOf(u.id)>=0,isMuted=mutedIds.indexOf(u.id)>=0;
    var p=permsMap[u.id]||{};
    function chk(k,label){var checked=p[k]!==false;return '<label class="re-chk"><input type="checkbox" data-perm="'+k+'" data-uid="'+u.id+'" '+(checked?'checked':'')+'> '+label+'</label>'}
    return '<div class="re-user"><div class="re-user-top"><span class="re-name">'+escapeHtml(u.nickname)+'</span><label class="re-chk"><input type="checkbox" data-co="'+u.id+'" '+(isCo?'checked':'')+'> 协管</label><label class="re-chk"><input type="checkbox" data-mute="'+u.id+'" '+(isMuted?'checked':'')+'> 禁言</label></div><div class="re-perms'+(isCo?' on':'')+'" data-perms-for="'+u.id+'">'+chk('revoke','撤回消息')+chk('mute','禁言用户')+chk('mic','管理连麦')+chk('game','发起游戏')+'</div></div>';
  }).join('');
  overlay.innerHTML='<div class="re-panel"><div class="re-head"><h3>⚙ 房间设置</h3><button id="reClose"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div class="re-body"><div class="re-field"><label>房间名称</label><input type="text" id="reName" maxlength="20" value="'+escapeHtml(room.name)+'" /></div><div class="re-field"><label>连麦模式</label><div class="re-radio-row"><label class="re-radio"><input type="radio" name="reMicMode" value="free" '+(room.mic_mode!=='host'?'checked':'')+'> 自由连麦</label><label class="re-radio"><input type="radio" name="reMicMode" value="host" '+(room.mic_mode==='host'?'checked':'')+'> 主持人连麦</label></div></div><div class="re-field"><label>连麦开关</label><label class="re-chk" style="font-size:.85em;"><input type="checkbox" id="reMicEnabled" '+(room.mic_enabled!==false?'checked':'')+'> 允许连麦</label></div><div class="re-field"><label>协助管理员 &amp; 权限</label>'+(userRows||'<div style="font-size:.8em;color:var(--text-muted);padding:8px 0;">暂无其他用户</div>')+'</div></div><div class="re-foot"><button class="cancel" id="reCancel">取消</button><button class="ok" id="reSave">保存</button></div></div>';
  document.body.appendChild(overlay);
  overlay.querySelectorAll('input[data-co]').forEach(function(cb){cb.onchange=function(){var uid=this.dataset.co;var box=overlay.querySelector('[data-perms-for="'+uid+'"]');if(box)box.classList.toggle('on',this.checked)}});
  overlay.querySelector('#reClose').onclick=function(){overlay.remove()};
  overlay.querySelector('#reCancel').onclick=function(){overlay.remove()};
  overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.remove()});
  overlay.querySelector('#reSave').onclick=async function(){
    var name=overlay.querySelector('#reName').value.trim();
    if(!name){showToast('请输入房间名称');return}
    var modeEl=overlay.querySelector('input[name="reMicMode"]:checked');
    var micMode=modeEl?modeEl.value:'free';
    var micEnabled=overlay.querySelector('#reMicEnabled').checked;
    var newCoIds=[],newPerms={},newMuted=[];
    overlay.querySelectorAll('input[data-co]').forEach(function(cb){if(cb.checked)newCoIds.push(cb.dataset.co)});
    overlay.querySelectorAll('input[data-mute]').forEach(function(cb){if(cb.checked)newMuted.push(cb.dataset.mute)});
    newCoIds.forEach(function(uid){newPerms[uid]={};overlay.querySelectorAll('input[data-perm][data-uid="'+uid+'"]').forEach(function(cb){newPerms[uid][cb.dataset.perm]=cb.checked})});
    var speaking=(room.mic_speaking||[]).filter(function(m){return newMuted.indexOf(m.user_id)<0});
    var requests=(room.mic_requests||[]).filter(function(m){return newMuted.indexOf(m.user_id)<0});
    try{
      var upd=await window.sb.from('rooms').update({name:name,mic_mode:micMode,mic_enabled:micEnabled,co_admin_ids:newCoIds,co_admin_permissions:newPerms,muted_user_ids:newMuted,mic_speaking:speaking,mic_requests:requests}).eq('id',state.room.id).select().single();
      if(upd.error)throw upd.error;
      state.room=upd.data;
      document.getElementById('roomTitle').textContent=upd.data.name;
      renderMic();renderGame();
      overlay.remove();
      showToast('✅ 设置已保存');
    }catch(e){showToast('保存失败：'+e.message)}
  };
}
window.openRoomEditor=openRoomEditor;

window.addEventListener('beforeunload',function(){
  if(state.room&&currentUser){
    try{
      var sp=(state.room.mic_speaking||[]).filter(function(m){return m.user_id!==currentUser.id});
      var rq=(state.room.mic_requests||[]).filter(function(m){return m.user_id!==currentUser.id});
      window.sb.from('rooms').update({mic_speaking:sp,mic_requests:rq}).eq('id',state.room.id);
      // ★ 退出游戏
      if(state.room.current_game){
        var game=state.room.current_game;
        var ps=(game.players||[]).filter(function(p){return p.user_id!==currentUser.id});
        if(!ps.length){window.sb.from('rooms').update({current_game:null}).eq('id',state.room.id)}
        else{window.sb.from('rooms').update({current_game:Object.assign({},game,{players:ps})}).eq('id',state.room.id)}
      }
    }catch(e){}
  }
});
